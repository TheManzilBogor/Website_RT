  let p = (phone||'').replace(/[^0-9]/g,'');

};

async function fetchAllRows(table, orderCol){
  try{
    const pageSize = 1000;
    const orderOpt = orderCol==='created_at' ? { ascending:false } : {};
    const buildQuery = (from) => {
      let q = supa.from(table).select('*').range(from, from + pageSize - 1);
      if(orderCol) q = q.order(orderCol, orderOpt);
      return q;
    };
    // Ambil halaman pertama dulu untuk tahu berapa total (lewat count exact)
    const countQuery = supa.from(table).select('*', { count:'exact', head:true });
    const [firstPage, countRes] = await Promise.all([buildQuery(0), countQuery]);
    if(firstPage.error) throw firstPage.error;
    let all = firstPage.data || [];
    const total = countRes.count || all.length;
    if(all.length < pageSize || all.length >= total){
      return all;
    }
    // Ambil sisa halaman secara paralel sekaligus (bukan berurutan satu-satu)
    const remainingPages = [];
    for(let from = pageSize; from < total; from += pageSize){
      remainingPages.push(buildQuery(from));
    }
    const results = await Promise.all(remainingPages);
    results.forEach(r=>{ if(!r.error && r.data) all = all.concat(r.data); });
    return all;
  }catch(e){
    console.warn('Gagal memuat tabel', table, '— dilewati, tabel lain tetap dimuat.', e);
    return [];
  }
}

function computeTunggakan(){
  const map = {};
  DB.tagihan.filter(t=>t.status==='belum').forEach(t=>{
    if(!map[t.wargaId]) map[t.wargaId] = { bulanSet:new Set(), total:0 };
    map[t.wargaId].bulanSet.add(t.bulan);
    map[t.wargaId].total += Number(t.nominal)||0;
  });
  return Object.keys(map).map(wid=>{
    const w = DB.warga.find(x=>x.id===wid) || {};
    const bulanArr = Array.from(map[wid].bulanSet).sort();
    return { wargaId:wid, nama:w.kepalaKeluarga||'(warga dihapus)', blok:w.blok||'', noRumah:w.noRumah||'-', bulan:bulanArr.length, bulanAwal:bulanArr[0], bulanAkhir:bulanArr[bulanArr.length-1], total:map[wid].total };
  }).sort((a,b)=>b.total-a.total);
}

function computeAutoTicker(){
  const msgs = [];
  const saldo = DB.keuangan.reduce((s,k)=>s+(k.jenis==='masuk'?Number(k.jumlah):-Number(k.jumlah)),0);
  msgs.push('💰 Saldo Kas RT saat ini: '+fmtRp(saldo));
  const tunggakan = computeTunggakan();
  if(tunggakan.length>0){
    tunggakan.forEach(t=>{
      msgs.push('⚠️ '+t.nama+' (Blok '+t.blok+' No.'+t.noRumah+') nunggak '+t.bulan+' bln — '+fmtRp(t.total));
    });
  } else if(DB.tagihan.length) {
    msgs.push('✅ Semua tagihan iuran tercatat lunas, terima kasih warga!');
  }
  const upcoming = [...DB.kegiatan].filter(k=>k.tanggal>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.tanggal.localeCompare(b.tanggal))[0];
  if(upcoming) msgs.push('📅 Agenda terdekat: '+upcoming.nama+' — '+upcoming.tanggal);
  return msgs;
}

function renderTicker(){
  const bar = document.getElementById('tickerBar');
  const auto = DB.settings.tickerAutoEnabled===false ? [] : computeAutoTicker();
  const custom = (DB.settings.tickerMessages||[]).filter(Boolean);
  const msgs = [...auto, ...custom];
  if(!msgs.length){ bar.style.display='none'; return; }
  bar.style.display='block';
  const text = msgs.join('     •     ') + '     •     ';
  document.getElementById('tickerTrack').textContent = text + text;
}

async function save(key){
  try{
    if(key==='settings'){
      const r = await supa.from('settings').upsert({ key:'site', value: DB.settings });
      if(r.error) throw r.error;
      return;
    }
    if(key==='warga'){
      if(DB.warga.length){
        const r1 = await supa.from('warga').upsert(DB.warga.map(toRowWarga), {onConflict:'id'});
        if(r1.error) throw r1.error;
      }
      const allAnggota = [];
      DB.warga.forEach(w=>{ (w.anggota||[]).forEach(a=>{ if(!a.id) a.id=uid(); allAnggota.push(toRowAnggota(a, w.id)); }); });
      if(allAnggota.length){
        const r2 = await supa.from('anggota').upsert(allAnggota, {onConflict:'id'});
        if(r2.error) throw r2.error;
      }
      return;
    }
    const table = TABLE[key];
    const mapper = { kategori:toRowKategori, tagihan:toRowTagihan, keuangan:toRowKeuangan, struktur:toRowStruktur, kegiatan:toRowKegiatan, mading:toRowMading, tatatertib:toRowTataTertib, pengaduan:toRowPengaduan, suratKeluar:toRowSuratKeluar, suratPermintaan:toRowSuratPermintaan }[key];
    if(DB[key].length){
      const r = await supa.from(table).upsert(DB[key].map(mapper), {onConflict:'id'});
      if(r.error) throw r.error;
    }
  }catch(e){
    console.error('Gagal simpan', key, e);
    alert('⚠️ GAGAL menyimpan ke database: ' + (e.message || JSON.stringify(e)) + '\n\nPerubahan Anda TIDAK tersimpan permanen. Screenshot pesan ini dan laporkan.');
    throw e;
  }
}

async function deleteRowFromDB(key, id){
  const tableMap = { warga:'warga', kategori:'kategori_iuran', tagihan:'tagihan', keuangan:'keuangan', struktur:'struktur', kegiatan:'kegiatan', mading:'mading', tatatertib:'tata_tertib', pengaduan:'pengaduan', anggota:'anggota', suratKeluar:'surat_keluar', suratPermintaan:'surat_permintaan' };
  try{ await supa.from(tableMap[key]).delete().eq('id', id); }
  catch(e){ console.error('Gagal hapus', key, id, e); }
}

async function deleteRowsFromDB(key, ids){
  const tableMap = { warga:'warga', kategori:'kategori_iuran', tagihan:'tagihan', keuangan:'keuangan', struktur:'struktur', kegiatan:'kegiatan', mading:'mading', tatatertib:'tata_tertib', pengaduan:'pengaduan', anggota:'anggota', suratKeluar:'surat_keluar', suratPermintaan:'surat_permintaan' };
  if(!ids.length) return;
  try{ await supa.from(tableMap[key]).delete().in('id', ids); }
  catch(e){ console.error('Gagal hapus banyak', key, e); }
}

/* ================= NAV ================= */
const PUBLIC_TABS = [
  ['beranda','Beranda'],['warga','Data Warga'],['iuran','Iuran IPL'],
  ['keuangan','Laporan Keuangan'],
  ['tatatertib','Tata Tertib'],['kegiatan','Kalender Kegiatan'],['mading','Mading'],
  ['struktur','Struktur RT'],['kontak','Hubungi Kami']
];

function renderNav(){
  const nav = document.getElementById('mainNav');
  let tabs = [...PUBLIC_TABS];
  if(isAdmin) tabs.push(['admin','Admin']);
  nav.innerHTML = tabs.map(([id,label]) =>
    `<button data-tab="${id}" class="${currentTab===id?'active':''}">${label}</button>`).join('') +
    (isAdmin ? `<button id="logoutBtn" style="border-color:var(--rose);color:#F6D9CF">Keluar Admin</button>` : '');
  nav.querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>{ currentTab=b.dataset.tab; nav.classList.remove('open'); render(); });
  const lo = document.getElementById('logoutBtn');
  if(lo) lo.onclick = ()=>{ isAdmin=false; currentTab='beranda'; nav.classList.remove('open'); render(); };
  const toggle = document.getElementById('navToggle');
  if(toggle && !toggle._wired){
    toggle._wired = true;
    toggle.onclick = () => nav.classList.toggle('open');
    document.addEventListener('click', (e) => {
      if(!nav.classList.contains('open')) return;
      if(nav.contains(e.target) || toggle.contains(e.target)) return;
      nav.classList.remove('open');
    });
  }
}

function renderPinnedNote(){
  const wrap = document.getElementById('pinnedNoteWrap');
  const latestMading = [...DB.mading].sort((a,b)=>b.tanggal.localeCompare(a.tanggal))[0];
  const upcoming = [...DB.kegiatan].filter(k=>k.tanggal>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.tanggal.localeCompare(b.tanggal))[0];
  let html='';
  if(upcoming){
    html = `<div class="note">📌 <span><b>Agenda terdekat:</b> ${esc(upcoming.nama)} — ${esc(upcoming.tanggal)}${upcoming.lokasi? ' @ '+esc(upcoming.lokasi):''}</span></div>`;
  } else if(latestMading){
    html = `<div class="note">📌 <span><b>Mading terbaru:</b> ${esc(latestMading.judul)}</span></div>`;
  }
  wrap.innerHTML = html;
}

/* ================= RENDER ROUTER ================= */
function render(){
  renderNav();
  renderPinnedNote();
  renderTicker();
  if(currentTab!=='admin'){
    document.getElementById('tickerBar').style.display = '';
    document.getElementById('pinnedNoteWrap').style.display = '';
  }
  const app = document.getElementById('app');
  const renderers = {
    beranda:renderBeranda, warga:renderWargaPublic, iuran:renderIuranPublic,
    keuangan:renderKeuanganPublic, struktur:renderStrukturPublic,
    tatatertib:renderTataTertibPublic, kegiatan:renderKegiatanPublic,
    mading:renderMadingPublic, kontak:renderKontakPublic, admin:renderAdmin
  };
  app.innerHTML = '';
  (renderers[currentTab]||renderBeranda)(app);
}

/* ================= BERANDA ================= */
function computeStatusTinggal(){
  const opts = STATUS_TINGGAL_OPTS;
  const counts = {}; opts.forEach(o=>counts[o]=0);
  let kosong = 0;
  DB.warga.forEach(w=>{
    if(w.statusTinggal && counts.hasOwnProperty(w.statusTinggal)) counts[w.statusTinggal]++;
    else kosong++;
  });
  return { counts, kosong };
}

function renderStatusTinggalCards(){
  const { counts, kosong } = computeStatusTinggal();
  const icons = { 'Tinggal Setiap Hari':'🏠', 'Tinggal Sewaktu-waktu':'🕒', 'Tidak Ditempati':'🚫', 'Rumah Sewa/Kontrak':'🔑' };
  const colors = ['c-emerald','c-teal','c-amber','c-indigo'];
  let html = `<div class="grid cols-3">`;
  Object.keys(counts).forEach((k,i)=>{
    html += `<div class="card dash-stat-card"><div class="dash-icon ${colors[i%colors.length]}">${icons[k]||'🏠'}</div><div><div class="stat">${counts[k]}</div><div class="stat-label">${esc(k)}</div></div></div>`;
  });
  if(kosong>0) html += `<div class="card dash-stat-card"><div class="dash-icon c-amber">❔</div><div><div class="stat">${kosong}</div><div class="stat-label">Belum diisi statusnya</div></div></div>`;
  html += `</div>`;
  return html;
}

function renderTunggakanTable(query){
  const q = (query||'').toLowerCase();
  let rows = computeTunggakan();
  if(q) rows = rows.filter(t=> (t.nama+' '+t.blok+' '+t.noRumah).toLowerCase().includes(q));
  if(!rows.length) return `<div class="empty">${q ? 'Tidak ada warga menunggak yang cocok dengan pencarian.' : 'Semua warga sudah lunas iuran, terima kasih 🎉'}</div>`;
  rows = rows.sort((a,b)=>{
    const blokCmp = (a.blok||'').localeCompare(b.blok||'', undefined, {numeric:true, sensitivity:'base'});
    if(blokCmp!==0) return blokCmp;
    return (a.noRumah||'').localeCompare(b.noRumah||'', undefined, {numeric:true, sensitivity:'base'});
  });
  return `<div style="max-height:480px; overflow-y:auto;"><table><thead><tr><th>Nama Warga</th><th>Blok</th><th>Tunggakan Iuran</th><th class="num">Nominal</th></tr></thead>
    <tbody>${rows.map(t=>`<tr><td>${esc(t.nama)}</td><td>${esc(t.blok)||'-'} ${esc(t.noRumah)}</td><td>${t.bulanAwal===t.bulanAkhir ? bulanNama(t.bulanAwal) : bulanNama(t.bulanAwal)+' – '+bulanNama(t.bulanAkhir)} <span class="small-muted">(${t.bulan} bln)</span></td><td class="num money-out">${fmtRp(t.total)}</td></tr>`).join('')}</tbody></table></div>
    <div class="small-muted" style="margin-top:8px">Menampilkan ${rows.length} rumah menunggak, diurutkan per Blok &amp; No. Rumah.</div>`;
}
function renderUpcomingList(){
  const list = [...DB.kegiatan].filter(k=>k.tanggal>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).slice(0,4);
  if(!list.length) return `<div class="empty">Belum ada agenda mendatang.</div>`;
  return `<table>${list.map(k=>`<tr><td class="num" style="width:90px;color:var(--primary)">${esc(k.tanggal)}</td><td>${esc(k.nama)}</td></tr>`).join('')}</table>`;
}
function renderLatestMadingList(){
  const list = [...DB.mading].sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).slice(0,4);
  if(!list.length) return `<div class="empty">Belum ada postingan mading.</div>`;
  return `<table>${list.map(m=>`<tr><td class="num" style="width:90px;color:var(--primary)">${esc(m.tanggal)}</td><td>${esc(m.judul)}</td></tr>`).join('')}</table>`;
}

  showModal(`Detail Rumah ${esc(w.blok?w.blok+' / ':'')}${esc(w.noRumah)} — ${esc(w.kepalaKeluarga)}`, `
    <div class="pill-row" style="margin-bottom:14px">

function renderIuranPublic(app){
  app.innerHTML = `
    <div class="section-title"><span class="eyebrow">Keuangan Warga</span><h2>Status Iuran IPL</h2></div>
    <div class="field"><input id="rumahSearch" type="text" placeholder="Cari nama warga atau blok/no. rumah..."></div>

    <h3 style="font-size:1rem">Ringkasan bulan ${bulanNama(monthNow())}</h3>
    <div id="iuranRingkasan"></div>
  `;
  let selectedId = '';
  const drawList = (query) => {
    const q = (query||'').toLowerCase();
    const rows = sortWarga(DB.warga).filter(w=> !q || (w.kepalaKeluarga+' '+w.blok+' '+w.noRumah).toLowerCase().includes(q));
    document.getElementById('rumahListWrap').innerHTML = rows.length ? rows.map(w=>`
      <div class="list-row-clickable" data-pilihrumah="${w.id}" style="padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--line); ${w.id===selectedId?'background:var(--primary-light)':''}">
        <b>${esc(w.blok?w.blok+' ':'')}${esc(w.noRumah)}</b> — ${esc(w.kepalaKeluarga)}
      </div>
    `).join('') : '<div class="empty" style="padding:14px">Tidak ada rumah yang cocok.</div>';
    document.querySelectorAll('[data-pilihrumah]').forEach(el=>el.onclick=()=>{ selectedId = el.dataset.pilihrumah; pilihRumah(selectedId); drawList(document.getElementById('rumahSearch').value); });
  };
  document.getElementById('rumahSearch').addEventListener('input', e => drawList(e.target.value));
  drawList('');
  const pilihRumah = id => {
    const wrap = document.getElementById('iuranDetail');
    if(!id){ wrap.innerHTML=''; return; }
    const rows = DB.tagihan.filter(t=>t.wargaId===id);
    if(!rows.length){ wrap.innerHTML = `<div class="empty">Belum ada riwayat tagihan untuk rumah ini.</div>`; return; }
    const belumRows = rows.filter(t=>t.status==='belum');
    const totalTunggakan = belumRows.reduce((s,t)=>s+Number(t.nominal||0),0);
    const bulanTunggakan = [...new Set(belumRows.map(t=>t.bulan))].sort();
    const rentangTunggakan = bulanTunggakan.length ? (bulanTunggakan[0]===bulanTunggakan[bulanTunggakan.length-1] ? bulanNama(bulanTunggakan[0]) : bulanNama(bulanTunggakan[0])+' – '+bulanNama(bulanTunggakan[bulanTunggakan.length-1])) : '';
    const byKat = {};
    rows.forEach(t=>{
      if(!byKat[t.kategoriId]) byKat[t.kategoriId] = { lunasBulan:[], belumBulan:[], belumNominal:0 };
      if(t.status==='lunas') byKat[t.kategoriId].lunasBulan.push(t.bulan);
      else { byKat[t.kategoriId].belumBulan.push(t.bulan); byKat[t.kategoriId].belumNominal += Number(t.nominal||0); }
    });
    wrap.innerHTML = `
      <div class="pill-row" style="margin-bottom:14px">
        <span class="badge ${belumRows.length?'belum':'lunas'}">${belumRows.length ? `⚠️ Menunggak ${bulanTunggakan.length} bulan (${rentangTunggakan})` : '✅ Lunas Semua Kategori'}</span>
        ${belumRows.length ? `<span class="badge belum">Total Tunggakan: ${fmtRp(totalTunggakan)}</span>` : ''}
      </div>
      <div class="grid cols-3">
        ${Object.keys(byKat).map((kid,i)=>{
          const k = byKat[kid];
          const kat = DB.kategori.find(x=>x.id===kid);
          const lunasTerakhir = k.lunasBulan.length ? bulanNama([...k.lunasBulan].sort().pop()) : '-';
          const colors = ['c-teal','c-indigo','c-amber','c-emerald'];
          const ada = k.belumBulan.length > 0;
          return `<div class="card">
            <div class="dash-stat-card" style="margin-bottom:10px">
              <div class="dash-icon ${colors[i%colors.length]}">${getKategoriIcon(kategoriNama(kid))}</div>
              <div>
                <div class="stat-label" style="line-height:1.3">${esc(kategoriNama(kid))}</div>
                <div class="small-muted" style="margin-top:2px">${fmtRp(kat?kat.nominalDefault:0)} / bulan</div>
              </div>
            </div>
            <div class="divider" style="margin:10px 0"></div>
            ${ada ? `
              <div class="pill-row" style="margin-bottom:6px"><span class="badge belum">⚠️ ${k.belumBulan.length} bulan tertunggak</span></div>
              <div class="stat money-out" style="font-size:1.2rem">${fmtRp(k.belumNominal)}</div>
              <div class="small-muted">Terakhir lunas: ${lunasTerakhir}</div>
            ` : `
              <div class="pill-row"><span class="badge lunas">✅ Lunas</span></div>
              <div class="small-muted" style="margin-top:6px">Terakhir lunas: ${lunasTerakhir}</div>
            `}
          </div>`;
        }).join('')}
      </div>
    `;
  };
  const bulan = monthNow();
  const byKat = {};
  DB.tagihan.filter(t=>t.bulan===bulan).forEach(t=>{
    byKat[t.kategoriId] = byKat[t.kategoriId] || {lunas:0, belum:0};
    byKat[t.kategoriId][t.status==='lunas'?'lunas':'belum']++;
  });
  const katCards = Object.keys(byKat).map((kid,i) => {
    const l = byKat[kid].lunas, b = byKat[kid].belum, tot = l+b;
    const pct = tot ? Math.round((l/tot)*100) : 0;
    const colors = ['c-teal','c-indigo','c-amber','c-emerald'];
    return `
    <div class="card dash-stat-card">
      <div class="dash-icon ${colors[i%colors.length]}">${getKategoriIcon(kategoriNama(kid))}</div>
      <div style="flex:1">
        <div class="stat-label">${esc(kategoriNama(kid))}</div>
        <div style="display:flex;gap:12px;margin:4px 0 8px 0">
          <span><b style="color:#047857">${l}</b> <span class="small-muted">lunas</span></span>
          <span><b style="color:var(--rose)">${b}</b> <span class="small-muted">belum</span></span>
        </div>
        <div style="background:var(--line);border-radius:999px;height:6px;overflow:hidden">
          <div style="background:linear-gradient(90deg,var(--primary),#047857);height:100%;width:${pct}%"></div>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('iuranRingkasan').innerHTML = katCards ? `<div class="grid cols-3">${katCards}</div>` : `<div class="empty">Belum ada tagihan bulan ini.</div>`;
}
function kategoriNama(id){ const k = DB.kategori.find(k=>k.id===id); return k?k.nama:'(kategori dihapus)'; }

function isBulanLocked(bulan){ return !!((DB.settings.laporanLock||{})[bulan]||{}).locked; }
function getLockInfo(bulan){ return (DB.settings.laporanLock||{})[bulan] || null; }
function cariPengurus(keyword){ const s = DB.struktur.find(x=>(x.jabatan||'').toLowerCase().includes(keyword)); return s ? s.nama : '(belum diisi)'; }

function generateDocxFromTemplate(templateBase64, data){
  const m = /^data:[^;]+;base64,(.+)$/.exec(templateBase64);
  const raw = m ? m[1] : templateBase64;
  const binary = atob(raw);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  const zip = new PizZip(bytes);
  const doc = new window.docxtemplater(zip, { paragraphLoop:true, linebreaks:true });
  doc.render(data);
  return doc.getZip().generate({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

function dataDasarTemplate(){
  return {
    nama_rt: DB.settings.rtName || '',
    alamat_rt: (DB.settings.kontak && DB.settings.kontak.alamat) || '',
    nama_ketua: cariPengurus('ketua'),
    nama_bendahara: cariPengurus('bendahara'),
    nama_sekretaris: cariPengurus('sekretaris'),
  };
}

function tryGenerateDocx(templateBase64, data, filename){
  try{
    const blob = generateDocxFromTemplate(templateBase64, data);
    downloadBlob(blob, filename);
  }catch(e){
    let pesan = e.message || 'Gagal mengisi template.';
    if(e.properties && e.properties.errors && e.properties.errors.length){
      pesan = 'Ada tag di template yang tidak dikenali: ' + e.properties.errors.map(er=>er.properties&&er.properties.id).filter(Boolean).join(', ');
    }
    alert('⚠️ Gagal membuat file Word: ' + pesan + '\n\nPastikan nama tag di dokumen Word Anda persis sesuai daftar yang diberikan (huruf kecil semua, pakai underscore, diapit kurung kurawal).');
  }
}

function pdfAddKopSurat(doc){
  const custom = DB.settings.kopSuratCustom;
  if(custom){
    try{
      const mc = /^data:image\/(png|jpe?g);base64,/i.exec(custom);
      const fmtC = mc ? mc[1].toUpperCase().replace('JPG','JPEG') : 'PNG';
      // gambar kop surat custom, lebar penuh halaman (182mm, area cetak A4 dengan margin 14mm kiri-kanan)
      doc.addImage(custom, fmtC, 14, 8, 182, 35);
      return 48;
    }catch(e){ /* kalau gagal render, lanjut pakai kop surat otomatis di bawah */ }
  }
  const logo = DB.settings.logo;
  const alamat = (DB.settings.kontak && DB.settings.kontak.alamat) || '';
  let textX = 14;
  if(logo){
    const m = /^data:image\/(png|jpe?g);base64,/i.exec(logo);
    const fmt = m ? m[1].toUpperCase().replace('JPG','JPEG') : 'PNG';
    try{ doc.addImage(logo, fmt, 14, 8, 20, 20); textX = 40; }catch(e){}
  }
  doc.setFont(undefined,'bold'); doc.setFontSize(13);
  doc.text(DB.settings.rtName || 'Pengurus RT', textX, 15);
  doc.setFont(undefined,'normal'); doc.setFontSize(9);
  doc.text('Papan Informasi & Layanan Warga', textX, 20);
  if(alamat) doc.text(alamat, textX, 25);
  doc.setLineWidth(0.9); doc.line(14, 31, 196, 31);
  doc.setLineWidth(0.2); doc.line(14, 32.5, 196, 32.5);
  return 40;
}

async function pdfGetNomorSurat(kode){
  try{
    const fresh = await supa.from('settings').select('*').eq('key','site').maybeSingle();
    if(fresh.data && fresh.data.value){
      DB.settings = { ...fresh.data.value, suratCounter: (fresh.data.value.suratCounter||0) + 1 };
    } else {
      DB.settings.suratCounter = (DB.settings.suratCounter||0) + 1;
    }
  }catch(e){
    DB.settings.suratCounter = (DB.settings.suratCounter||0) + 1;
  }
  const romawi = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][new Date().getMonth()];
  return String(DB.settings.suratCounter).padStart(3,'0') + '/' + kode + '/RT-DIGITAL/' + romawi + '/' + new Date().getFullYear();
}

async function pdfAddNomorTanggal(doc, kode, y){
  const nomor = await pdfGetNomorSurat(kode);
  const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const bln = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const now = new Date();
  doc.setFontSize(9);
  doc.text('Nomor: '+nomor, 14, y);
  doc.text('Tanggal Terbit: '+hari[now.getDay()]+', '+now.getDate()+' '+bln[now.getMonth()]+' '+now.getFullYear(), 14, y+5);
  return y + 11;
}

function cariPengurusObj(keyword){ return DB.struktur.find(x=>(x.jabatan||'').toLowerCase().includes(keyword)) || null; }

function pdfAddTandaTangan(doc, y){
  if(y > 235){ doc.addPage(); y = 20; }
  doc.setFontSize(9); doc.setFont(undefined,'italic');
  doc.text('Mengetahui & Menyetujui,', 14, y);
  doc.setFont(undefined,'normal');
  y += 10;
  const colWidth = 60;
  const jabatanList = [['Ketua RT', 'ketua'],['Bendahara RT', 'bendahara'],['Sekretaris RT', 'sekretaris']];
  jabatanList.forEach((p,i)=>{
    const x = 14 + i*colWidth;
    const pengurus = cariPengurusObj(p[1]);
    const namaOrang = pengurus ? pengurus.nama : '(belum diisi)';
    doc.setFontSize(9); doc.text(p[0], x, y);
    if(pengurus && pengurus.ttd){
      try{
        const m = /^data:image\/(png|jpe?g);base64,/i.exec(pengurus.ttd);
        const fmt = m ? m[1].toUpperCase().replace('JPG','JPEG') : 'PNG';
        doc.addImage(pengurus.ttd, fmt, x, y+3, 40, 16);
      }catch(e){}
    }
    doc.text('_____________________', x, y+22);
    doc.setFontSize(10); doc.setFont(undefined,'bold'); doc.text(namaOrang, x, y+28); doc.setFont(undefined,'normal');
    // Stempel RT ditempel menumpuk dekat tanda tangan Ketua RT (kolom pertama), khas dokumen resmi
    if(i===0 && DB.settings.stempel){
      try{
        const m2 = /^data:image\/(png|jpe?g);base64,/i.exec(DB.settings.stempel);
        const fmt2 = m2 ? m2[1].toUpperCase().replace('JPG','JPEG') : 'PNG';
        doc.addImage(DB.settings.stempel, fmt2, x+26, y+6, 26, 26);
      }catch(e){}
    }
  });
  return y + 34;
}

function syncTagihanToKeuangan(t){
  const idx = DB.keuangan.findIndex(k=>k.sumberTagihanId===t.id);
  if(t.status==='lunas'){
    const kat = DB.kategori.find(k=>k.id===t.kategoriId);
    const w = DB.warga.find(x=>x.id===t.wargaId);
    const tanggal = t.tanggalBayar || new Date().toISOString().slice(0,10);
    if(isBulanLocked(tanggal.slice(0,7))) return;
    const entry = {
      id: idx>=0 ? DB.keuangan[idx].id : uid(),
      tanggal, jenis:'masuk', kategori: kat?kat.nama:'Iuran',
      keterangan: `Iuran ${kat?kat.nama:''} — ${w?w.kepalaKeluarga:''} (${w?(w.blok?w.blok+' ':'')+w.noRumah:''}) ${bulanNama(t.bulan)}`,
      jumlah: t.nominal||0, sumberTagihanId: t.id
    };
    if(idx>=0) DB.keuangan[idx] = entry; else DB.keuangan.push(entry);
  } else if(idx>=0){
    if(!isBulanLocked(DB.keuangan[idx].tanggal.slice(0,7))) DB.keuangan.splice(idx,1);
  }
}

async function downloadStatusIuranPdf(bulan){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = pdfAddKopSurat(doc);
  doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.text('LAPORAN STATUS IURAN IPL', 105, y, {align:'center'}); doc.setFont(undefined,'normal');
  y += 7;
  doc.setFontSize(10); doc.text('Periode: '+bulanNama(bulan), 105, y, {align:'center'});
  y += 8;
  y = await pdfAddNomorTanggal(doc, 'IPL', y);

  const tunggakanMap = {};
  computeTunggakan().forEach(t=>{ tunggakanMap[t.wargaId] = t; });

  const rows = sortWarga(DB.warga).map(w=>{
    const t = DB.tagihan.filter(x=>x.wargaId===w.id && x.bulan===bulan);
    const lunasCount = t.filter(x=>x.status==='lunas').length;
    const status = !t.length ? 'Belum Digenerate' : (lunasCount===t.length ? 'LUNAS' : 'BELUM LUNAS');
    const tng = tunggakanMap[w.id];
    const rentang = tng ? (tng.bulanAwal===tng.bulanAkhir ? bulanNama(tng.bulanAwal) : bulanNama(tng.bulanAwal)+' – '+bulanNama(tng.bulanAkhir)) : '-';
    return [ (w.blok||'-')+' / '+w.noRumah, w.kepalaKeluarga, t.length?`${lunasCount}/${t.length}`:'-', status, tng?`${tng.bulan} bln`:'-', rentang, tng?fmtRp(tng.total):'-' ];
  });
  const totalLunas = rows.filter(r=>r[3]==='LUNAS').length;
  const totalBelum = rows.filter(r=>r[3]==='BELUM LUNAS').length;
  const grandTotalTunggakan = Object.values(tunggakanMap).reduce((s,t)=>s+t.total,0);
  doc.setFontSize(10);
  doc.text(`Rumah lunas semua kategori bulan ini: ${totalLunas}   |   Rumah masih ada tunggakan bulan ini: ${totalBelum}`, 14, y);
  y += 5;
  doc.setFont(undefined,'bold'); doc.text(`Total tunggakan seluruh warga (akumulasi semua bulan): ${fmtRp(grandTotalTunggakan)}`, 14, y); doc.setFont(undefined,'normal');
  y += 7;

  doc.autoTable({
    startY: y,
    head: [['Blok/Rumah','Kepala Keluarga','Lunas/Total\n(Bulan Ini)','Status\n(Bulan Ini)','Bulan\nMenunggak','Rentang Tunggakan','Total Tunggakan\n(Semua Bulan)']],
    body: rows,
    styles:{ fontSize:7.5 },
    didParseCell: function(data){
      if(data.section==='body' && data.column.index===3){
        if(data.cell.raw==='LUNAS') data.cell.styles.textColor=[4,120,87];
        else if(data.cell.raw==='BELUM LUNAS') data.cell.styles.textColor=[190,18,60];
      }
      if(data.section==='body' && data.column.index===6 && data.cell.raw!=='-'){
        data.cell.styles.textColor=[190,18,60]; data.cell.styles.fontStyle='bold';
      }
    }
  });

  pdfAddTandaTangan(doc, doc.lastAutoTable.finalY + 16);
  await save('settings');
  doc.save('Status-Iuran-IPL-'+bulan+'.pdf');
}

async function downloadLaporanPdf(bulan, trx, masuk, keluar, saldoSemua){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = pdfAddKopSurat(doc);
  doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.text('LAPORAN KEUANGAN KAS RT', 105, y, {align:'center'}); doc.setFont(undefined,'normal');
  y += 7;
  doc.setFontSize(10); doc.text('Periode: '+bulanNama(bulan), 105, y, {align:'center'});
  y += 8;
  y = await pdfAddNomorTanggal(doc, 'KEU', y);
  const saldoRealtime = computeSaldo().total;
  doc.setFillColor(31,111,92); doc.rect(14, y, 182, 14, 'F');
  doc.setTextColor(255,255,255); doc.setFontSize(11); doc.setFont(undefined,'bold');
  doc.text('TOTAL SALDO KAS RT SAAT INI (REAL-TIME, SEMUA KATEGORI): '+fmtRp(saldoRealtime), 105, y+9, {align:'center'});
  doc.setFont(undefined,'normal'); doc.setTextColor(0,0,0);
  y += 20;
  doc.setFontSize(10);
  doc.text('Pemasukan bulan ini: '+fmtRp(masuk), 14, y);
  doc.text('Pengeluaran bulan ini: '+fmtRp(keluar), 14, y+6);
  doc.text('Selisih bulan ini: '+fmtRp(masuk-keluar), 14, y+12);
  y += 20;
  doc.setFontSize(9); doc.setFont(undefined,'italic');
  const catatanLines = doc.splitTextToSize('Tabel di bawah adalah saldo KUMULATIF per kategori sampai dengan '+bulanNama(bulan)+' (bukan saldo saat ini kalau periode yang dipilih bukan bulan terbaru).', 182);
  doc.text(catatanLines, 14, y);
  doc.setFont(undefined,'normal');
  y += catatanLines.length * 4.5 + 3;
  doc.autoTable({
    startY:y, head:[['Kategori','Saldo Kumulatif']],
    body:Object.keys(saldoSemua).map(k=>[k, fmtRp(saldoSemua[k])])
  });
  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 8,
    head:[['Tanggal','Kategori','Keterangan','Jenis','Jumlah']],
    body: trx.map(t=>[t.tanggal, t.kategori, t.keterangan||'-', t.jenis, fmtRp(t.jumlah)])
  });
  y = doc.lastAutoTable.finalY + 12;
  const lock = getLockInfo(bulan);
  if(lock && lock.locked){
    doc.setFontSize(9); doc.setTextColor(15,118,110);
    const lockLines = doc.splitTextToSize('[DISAHKAN] Laporan bulan ini telah DISAHKAN pada '+(lock.tanggal||'-')+' oleh Pengurus RT dan datanya terkunci.', 182);
    doc.text(lockLines, 14, y);
    y += lockLines.length * 4.5;
    if(lock.catatan){ const catLines = doc.splitTextToSize('Catatan: '+lock.catatan, 182); doc.text(catLines, 14, y); y += catLines.length * 4.5; }
    doc.setTextColor(0,0,0);
    y += 6;
  } else {
    doc.setFontSize(9); doc.setTextColor(180,120,20);
    const belumLines = doc.splitTextToSize('[BELUM DISAHKAN] Catatan: laporan bulan ini BELUM disahkan pengurus — data masih dapat berubah sewaktu-waktu.', 182);
    doc.text(belumLines, 14, y);
    y += belumLines.length * 4.5;
    doc.setTextColor(0,0,0);
    y += 6;
  }
  pdfAddTandaTangan(doc, y);
  await save('settings');
  doc.save('Laporan-Keuangan-'+bulan+'.pdf');
}

    };

    document.getElementById('srSubmitBtn').disabled = false;
  };
}

function renderIuranDashboardCards(){
  const bulan = monthNow();
  const rows = DB.tagihan.filter(t=>t.bulan===bulan);
  const rumahBulanIni = new Set(rows.map(t=>t.wargaId));
  const rumahLunasSemua = [...rumahBulanIni].filter(wid => rows.filter(t=>t.wargaId===wid).every(t=>t.status==='lunas'));
  const rumahBelum = rumahBulanIni.size - rumahLunasSemua.length;
  const tunggakanSemua = computeTunggakan();
  const totalTunggakanNominal = tunggakanSemua.reduce((s,t)=>s+t.total,0);
  return `<div class="grid cols-3">
    <div class="card dash-stat-card"><div class="dash-icon c-emerald">✅</div><div><div class="stat">${rumahLunasSemua.length}</div><div class="stat-label">Rumah lunas semua kategori bulan ini</div></div></div>
    <div class="card dash-stat-card"><div class="dash-icon c-amber">⚠️</div><div><div class="stat">${rumahBelum}</div><div class="stat-label">Rumah masih ada tunggakan bulan ini</div></div></div>
    <div class="card dash-stat-card"><div class="dash-icon c-indigo">💰</div><div><div class="stat" style="font-size:1.3rem">${fmtRp(totalTunggakanNominal)}</div><div class="stat-label">Total tunggakan seluruh warga (semua bulan)</div></div></div>
  </div>`;
}

/* ---- Admin: Warga ---- */
function sortWarga(list){
  return [...list].sort((a,b)=>{
    const blokCmp = (a.blok||'').localeCompare(b.blok||'', undefined, {numeric:true, sensitivity:'base'});
    if(blokCmp!==0) return blokCmp;
    return (a.noRumah||'').localeCompare(b.noRumah||'', undefined, {numeric:true, sensitivity:'base'});
  });
}

function adminWarga(el){
  const selected = new Set();
  el.innerHTML = `
    <div class="warn">⚠️ Data sekarang tersimpan di database Supabase Anda (bukan lagi storage sementara Claude). Yang masih perlu diperbaiki untuk produksi: kata sandi admin masih dicek di browser (bukan sistem login sungguhan) — pertimbangkan Supabase Auth kalau butuh lebih aman.</div>

    ${renderStatusMaritalCards()}

    <div class="toolbar">
      <button class="btn" id="addWargaBtn">+ Tambah Rumah</button>
      <button class="btn outline" id="importWargaBtn">⤴ Import CSV</button>
      <button class="btn outline" id="updateMaritalBtn">🔄 Update Marital &amp; Kategori Anggota</button>
      <button class="btn ochre" id="exportWargaBtn">⬇ Download Data (Excel)</button>
      <button class="btn brick" id="deleteSelectedBtn" style="display:none">🗑 Hapus Terpilih (<span id="selCount">0</span>)</button>
      <button class="btn brick" id="deleteAllWargaBtn">🗑 Hapus Semua Data</button>
    </div>
    <div class="toolbar"><input class="grow" id="searchWargaAdmin" type="text" placeholder="Cari nama kepala keluarga, blok, atau no. rumah..."></div>
    <div id="wargaAdminTableWrap"></div>
  `;
  const updateSelBtn = () => {
    const btn = document.getElementById('deleteSelectedBtn');
    btn.style.display = selected.size ? 'inline-flex' : 'none';
    document.getElementById('selCount').textContent = selected.size;
  };
  const draw = () => {
    const q = (document.getElementById('searchWargaAdmin').value||'').toLowerCase();
    const rows = sortWarga(DB.warga.filter(w=> (w.noRumah+' '+w.blok+' '+w.kepalaKeluarga).toLowerCase().includes(q)));
    const allChecked = rows.length>0 && rows.every(w=>selected.has(w.id));
    document.getElementById('wargaAdminTableWrap').innerHTML = `
      <table><thead><tr><th style="width:36px"><input type="checkbox" id="selectAllWarga" ${allChecked?'checked':''}></th><th>Blok</th><th>No. Rumah</th><th>Kepala Keluarga</th><th>Status Tinggal</th><th>Status Marital</th><th class="num">KK</th><th class="num">Luar KK</th><th class="num">Anak</th><th class="num">L</th><th class="num">P</th><th>No. HP</th><th></th></tr></thead>
      <tbody>${rows.map(w=>`<tr>
        <td><input type="checkbox" data-check="${w.id}" ${selected.has(w.id)?'checked':''}></td>
        <td>${esc(w.blok)||'-'}</td><td>${esc(w.noRumah)}</td><td>${esc(w.kepalaKeluarga)}</td><td class="small-muted">${esc(w.statusTinggal)||'-'}</td><td class="small-muted">${esc(getStatusMaritalKK(w))||'-'}</td><td class="num">${w.jumlahKK||0}</td><td class="num">${w.jumlahLuarKK||0}</td><td class="num">${w.jumlahAnak||0}</td><td class="num">${w.lakiLaki||0}</td><td class="num">${w.perempuan||0}</td><td>${esc(w.noHP||'-')}</td>
        <td><button class="btn sm outline" data-anggota="${w.id}">Kelola Anggota${w.anggota&&w.anggota.length?' ('+w.anggota.length+')':''}</button> <button class="btn sm outline" data-edit="${w.id}">Edit</button> <button class="btn sm brick" data-del="${w.id}">Hapus</button></td>
      </tr>`).join('') || '<tr><td colspan="13" class="empty">Belum ada data, atau tidak ditemukan.</td></tr>'}</tbody></table>
    `;
    document.getElementById('selectAllWarga').onchange = (e) => {
      rows.forEach(w=> e.target.checked ? selected.add(w.id) : selected.delete(w.id));
      draw();
    };
    document.querySelectorAll('[data-check]').forEach(cb=>cb.onchange=()=>{
      cb.checked ? selected.add(cb.dataset.check) : selected.delete(cb.dataset.check);
      updateSelBtn();
      document.getElementById('selectAllWarga').checked = rows.length>0 && rows.every(w=>selected.has(w.id));
    });
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openWargaModal(b.dataset.edit));
    document.querySelectorAll('[data-anggota]').forEach(b=>b.onclick=()=>openAnggotaAdminModal(b.dataset.anggota));
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async ()=>{ if(confirm('Hapus data rumah ini?')){ DB.warga = DB.warga.filter(w=>w.id!==b.dataset.del); selected.delete(b.dataset.del); await deleteRowFromDB('warga', b.dataset.del); await save('warga'); renderAdmin(document.getElementById('app')); }});
    updateSelBtn();
  };
  document.getElementById('searchWargaAdmin').addEventListener('input', draw);
  draw();
  document.getElementById('addWargaBtn').onclick = () => openWargaModal(null);
  document.getElementById('importWargaBtn').onclick = () => openImportModal();
  document.getElementById('updateMaritalBtn').onclick = () => openUpdateMaritalModal();
  document.getElementById('exportWargaBtn').onclick = () => exportWargaXlsx();
  document.getElementById('deleteSelectedBtn').onclick = async () => {
    if(!selected.size) return;
    if(!confirm(`Hapus ${selected.size} rumah terpilih beserta anggotanya? Tindakan ini tidak bisa dibatalkan.`)) return;
    const idsToDelete = [...selected];
    DB.warga = DB.warga.filter(w=>!selected.has(w.id));
    selected.clear();
    await deleteRowsFromDB('warga', idsToDelete);
    await save('warga');
    renderAdmin(document.getElementById('app'));
  };
  document.getElementById('deleteAllWargaBtn').onclick = async () => {
    if(!DB.warga.length){ alert('Data warga memang sudah kosong.'); return; }
    const konfirmasi = prompt(`Ini akan MENGHAPUS SEMUA ${DB.warga.length} data rumah beserta anggotanya secara permanen. Ketik HAPUS SEMUA untuk konfirmasi:`);
    if(konfirmasi !== 'HAPUS SEMUA'){ if(konfirmasi!==null) alert('Dibatalkan, teks konfirmasi tidak cocok.'); return; }
    try{ await supa.from('anggota').delete().neq('id','00000000-0000-0000-0000-000000000000'); await supa.from('warga').delete().neq('id','00000000-0000-0000-0000-000000000000'); }catch(e){ console.error(e); }
    DB.warga = [];
    renderAdmin(document.getElementById('app'));
  };
}

function exportKeuanganXlsx(trx, labelPeriode){
  const rows = [...trx].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).map(t=>({
    'Tanggal': t.tanggal, 'Jenis': t.jenis==='masuk'?'Pemasukan':'Pengeluaran', 'Kategori': t.kategori,
    'Keterangan': t.keterangan||'', 'Jumlah': t.jumlah||0
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length?rows:[{'Info':'Belum ada transaksi'}]), 'Transaksi Kas RT');
  const saldo = computeSaldo();
  const saldoRows = saldo.list.map(s=>({'Kategori':s.nama,'Saldo':s.saldo}));
  saldoRows.push({'Kategori':'TOTAL','Saldo':saldo.total});
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(saldoRows.length?saldoRows:[{'Info':'Belum ada saldo'}]), 'Saldo per Kategori');
  XLSX.writeFile(wb, 'Kas-RT-'+labelPeriode.replace(/[^a-z0-9]/gi,'_')+'-'+DB.settings.rtName.replace(/[^a-z0-9]/gi,'_')+'.xlsx');
}

function exportIuranXlsx(bulan){
  const tunggakanMap = {};
  computeTunggakan().forEach(t=>{ tunggakanMap[t.wargaId] = t; });
  const rows = sortWarga(DB.warga).map(w=>{
    const t = DB.tagihan.filter(x=>x.wargaId===w.id && x.bulan===bulan);
    const lunasCount = t.filter(x=>x.status==='lunas').length;
    const tng = tunggakanMap[w.id];
    const rentang = tng ? (tng.bulanAwal===tng.bulanAkhir ? bulanNama(tng.bulanAwal) : bulanNama(tng.bulanAwal)+' – '+bulanNama(tng.bulanAkhir)) : '';
    return {
      'Blok': w.blok||'', 'No. Rumah': w.noRumah, 'Kepala Keluarga': w.kepalaKeluarga,
      'Lunas/Total Kategori (Bulan Ini)': t.length?`${lunasCount}/${t.length}`:'-',
      'Status (Bulan Ini)': !t.length ? 'Belum Digenerate' : (lunasCount===t.length ? 'LUNAS' : 'BELUM LUNAS'),
      'Jumlah Bulan Menunggak (Semua Bulan)': tng ? tng.bulan : 0,
      'Rentang Bulan Menunggak': rentang,
      'Total Tunggakan (Semua Bulan)': tng ? tng.total : 0
    };
  });
  const detailRows = [];
  DB.tagihan.filter(t=>t.bulan===bulan).forEach(t=>{
    const w = DB.warga.find(x=>x.id===t.wargaId); const kat = DB.kategori.find(k=>k.id===t.kategoriId);
    detailRows.push({ 'Blok':w?w.blok:'', 'No. Rumah':w?w.noRumah:'', 'Kepala Keluarga':w?w.kepalaKeluarga:'', 'Kategori':kat?kat.nama:'', 'Nominal':t.nominal, 'Status':t.status==='lunas'?'Lunas':'Belum', 'Tgl Bayar':t.tanggalBayar||'' });
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length?rows:[{'Info':'Belum ada data'}]), 'Ringkasan per Rumah');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detailRows.length?detailRows:[{'Info':'Belum ada tagihan'}]), 'Detail per Kategori');
  XLSX.writeFile(wb, 'Status-Iuran-IPL-'+bulan+'-'+DB.settings.rtName.replace(/[^a-z0-9]/gi,'_')+'.xlsx');
}

function exportWargaXlsx(){
  const ringkasan = sortWarga(DB.warga).map(w=>({
    'Blok': w.blok||'', 'No. Rumah': w.noRumah, 'Kepala Keluarga': w.kepalaKeluarga, 'Status Tempat Tinggal': w.statusTinggal||'', 'No. HP': w.noHP||'',

const HUBUNGAN_OPTS = ['Kepala Keluarga','Istri','Anak','Orang Tua','Saudara'];
const STATUS_KK_OPTS = ['Dalam KK','Luar KK'];
const STATUS_MARITAL_OPTS = ['Belum Menikah','Sudah Menikah','Duda','Janda'];

function isLuarKK(a){
  if(a.statusKK) return a.statusKK==='Luar KK';
  return a.status==='Anggota Luar KK'; // data lama sebelum field ini dipisah
}

function recomputeFromAnggota(w){
  const a = w.anggota || [];
  if(!a.length) return;
  w.jumlahKK = a.filter(x=>!isLuarKK(x)).length;
  w.jumlahLuarKK = a.filter(x=>isLuarKK(x)).length;
  w.jumlahAnak = a.filter(x=>x.status==='Anak').length;
  w.lakiLaki = a.filter(x=>x.gender==='L').length;
  w.perempuan = a.filter(x=>x.gender==='P').length;
}

function getStatusMaritalKK(w){
  const kk = (w.anggota||[]).find(a=>a.status==='Kepala Keluarga');
  return kk ? (kk.statusMarital||'') : '';
}

function computeStatusMarital(){
  const counts = {}; STATUS_MARITAL_OPTS.forEach(o=>counts[o]=0);
  let kosong = 0;
  DB.warga.forEach(w=>{
    const m = getStatusMaritalKK(w);
    if(m && counts.hasOwnProperty(m)) counts[m]++;
    else kosong++;
  });
  return { counts, kosong };
}

function renderStatusMaritalCards(){
  const { counts, kosong } = computeStatusMarital();
  const icons = { 'Belum Menikah':'💍', 'Sudah Menikah':'👫', 'Duda':'🕊️', 'Janda':'🕊️' };
  const colors = ['c-teal','c-emerald','c-indigo','c-amber'];
  let html = `<div class="grid cols-3">`;
  Object.keys(counts).forEach((k,i)=>{
    html += `<div class="card dash-stat-card"><div class="dash-icon ${colors[i%colors.length]}">${icons[k]||'💍'}</div><div><div class="stat">${counts[k]}</div><div class="stat-label">${esc(k)} (Kepala Keluarga)</div></div></div>`;
  });
  if(kosong>0) html += `<div class="card dash-stat-card"><div class="dash-icon c-amber">❔</div><div><div class="stat">${kosong}</div><div class="stat-label">Belum diisi status maritalnya</div></div></div>`;
  html += `</div>`;
  return html;
}

function openAnggotaAdminModal(wargaId){
  const w = DB.warga.find(x=>x.id===wargaId);

  if(!w.anggota) w.anggota = [];
  const renderRows = () => w.anggota.map((a,i)=>{
    const hubunganVal = HUBUNGAN_OPTS.includes(a.status) ? a.status : '';
    const kkVal = a.statusKK || (isLuarKK(a) ? 'Luar KK' : 'Dalam KK');
    return `
    <tr>
      <td><input data-a-nama="${i}" value="${esc(a.nama)}" style="min-width:130px"></td>
      <td><select data-a-status="${i}"><option value="" ${!hubunganVal?'selected':''}>- Pilih -</option>${HUBUNGAN_OPTS.map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
      <td><select data-a-kk="${i}">${STATUS_KK_OPTS.map(s=>`<option ${kkVal===s?'selected':''}>${s}</option>`).join('')}</select></td>
      <td><select data-a-marital="${i}"><option value="" ${!a.statusMarital?'selected':''}>- Pilih -</option>${STATUS_MARITAL_OPTS.map(s=>`<option ${a.statusMarital===s?'selected':''}>${s}</option>`).join('')}</select></td>
      <td><select data-a-gender="${i}"><option value="" ${!a.gender?'selected':''}>- Pilih -</option><option value="L" ${a.gender==='L'?'selected':''}>L</option><option value="P" ${a.gender==='P'?'selected':''}>P</option></select></td>
      <td><input type="number" data-a-usia="${i}" value="${a.usia||''}" style="width:65px"></td>
      <td style="white-space:nowrap">
        <div style="display:inline-flex;flex-direction:column;vertical-align:middle;margin-right:4px">
          <button class="btn sm outline" data-a-up="${i}" style="padding:2px 7px;margin-bottom:2px" ${i===0?'disabled':''}>▲</button>
          <button class="btn sm outline" data-a-down="${i}" style="padding:2px 7px" ${i===w.anggota.length-1?'disabled':''}>▼</button>
        </div>
        <button class="btn sm brick" data-a-del="${i}" style="vertical-align:middle">✕</button>
      </td>
    </tr>`;
  }).join('');
  showModal(`Kelola Anggota — Rumah ${esc(w.noRumah)}`, `
    <p class="small-muted">Isi satu per satu nama anggota yang tinggal di rumah ini. Jumlah anggota KK, luar KK, anak, dan L/P di tabel utama akan otomatis dihitung ulang dari daftar ini. Status Marital pada baris "Kepala Keluarga" akan tampil di halaman publik.</p>
    <div style="overflow-x:auto">
    <table id="anggotaTable"><thead><tr><th>Nama</th><th>Hubungan</th><th>Status KK</th><th>Status Marital</th><th>Gender</th><th>Usia</th><th></th></tr></thead>
    <tbody id="anggotaTbody">${renderRows()}</tbody></table>
    </div>
    <button class="btn sm outline" id="addAnggotaRowBtn" style="margin-top:10px">+ Tambah Baris</button>
    <div class="divider"></div>
    <button class="btn" id="saveAnggotaBtn" style="width:100%">Simpan Anggota</button>
  `);
  const syncFromDom = () => {
    document.querySelectorAll('[data-a-nama]').forEach(inp=>{ if(w.anggota[+inp.dataset.aNama]) w.anggota[+inp.dataset.aNama].nama = inp.value; });
    document.querySelectorAll('[data-a-status]').forEach(sel=>{ if(w.anggota[+sel.dataset.aStatus]) w.anggota[+sel.dataset.aStatus].status = sel.value; });
    document.querySelectorAll('[data-a-kk]').forEach(sel=>{ if(w.anggota[+sel.dataset.aKk]) w.anggota[+sel.dataset.aKk].statusKK = sel.value; });
    document.querySelectorAll('[data-a-marital]').forEach(sel=>{ if(w.anggota[+sel.dataset.aMarital]) w.anggota[+sel.dataset.aMarital].statusMarital = sel.value; });
    document.querySelectorAll('[data-a-gender]').forEach(sel=>{ if(w.anggota[+sel.dataset.aGender]) w.anggota[+sel.dataset.aGender].gender = sel.value; });
    document.querySelectorAll('[data-a-usia]').forEach(inp=>{ if(w.anggota[+inp.dataset.aUsia]) w.anggota[+inp.dataset.aUsia].usia = inp.value; });
  };
  const removedAnggotaIds = [];
  const bindRowEvents = () => {
    document.querySelectorAll('[data-a-del]').forEach(b=>b.onclick=()=>{
      syncFromDom();
      const removed = w.anggota[+b.dataset.aDel];
      if(removed && removed.id) removedAnggotaIds.push(removed.id);
      w.anggota.splice(+b.dataset.aDel,1); document.getElementById('anggotaTbody').innerHTML = renderRows(); bindRowEvents();
    });
    document.querySelectorAll('[data-a-up]').forEach(b=>b.onclick=()=>{
      syncFromDom(); const i = +b.dataset.aUp; if(i<=0) return;
      [w.anggota[i-1], w.anggota[i]] = [w.anggota[i], w.anggota[i-1]];
      document.getElementById('anggotaTbody').innerHTML = renderRows(); bindRowEvents();
    });
    document.querySelectorAll('[data-a-down]').forEach(b=>b.onclick=()=>{
      syncFromDom(); const i = +b.dataset.aDown; if(i>=w.anggota.length-1) return;
      [w.anggota[i+1], w.anggota[i]] = [w.anggota[i], w.anggota[i+1]];
      document.getElementById('anggotaTbody').innerHTML = renderRows(); bindRowEvents();
    });
  };
  bindRowEvents();
  document.getElementById('addAnggotaRowBtn').onclick = () => {
    syncFromDom();
    w.anggota.push({nama:'', status:'Anggota Keluarga (KK)', gender:'L', usia:''});
    document.getElementById('anggotaTbody').innerHTML = renderRows();
    bindRowEvents();
  };
  document.getElementById('saveAnggotaBtn').onclick = async () => {
    syncFromDom();

    document.querySelectorAll('[data-a-status]').forEach(sel=>{ w.anggota[+sel.dataset.aStatus].status = sel.value; });
    document.querySelectorAll('[data-a-gender]').forEach(sel=>{ w.anggota[+sel.dataset.aGender].gender = sel.value; });
    document.querySelectorAll('[data-a-usia]').forEach(inp=>{ w.anggota[+inp.dataset.aUsia].usia = inp.value; });
    w.anggota = w.anggota.filter(a=>a.nama);
    recomputeFromAnggota(w);
    await deleteRowsFromDB('anggota', removedAnggotaIds);
    await save('warga');
    closeModal(); renderAdmin(document.getElementById('app'));
  };
}

function openUpdateMaritalModal(){
  showModal('Update Status Marital &amp; Hubungan Anggota (CSV)', `
    <p class="small-muted">Khusus untuk memperbarui <b>Status Marital Kepala Keluarga</b> dan <b>Hubungan (Kepala Keluarga/Istri/Anak/Orang Tua/Saudara)</b> tiap anggota — tanpa mengubah data lain (No HP, Status Tempat Tinggal, dll). Rumah dicocokkan lewat Blok + No. Rumah, anggota dicocokkan lewat nama.</p>
    <p class="small-muted">Format (dipisah koma), tanpa header:<br><code>blok,noRumah,statusMaritalKK,anggota</code><br>Kolom <b>anggota</b>: <code>Nama|Hubungan;Nama2|Hubungan2</code>. Anggota dengan nama yang sudah ada akan diperbarui hubungannya saja (gender/usia/no HP tidak berubah); nama yang belum ada akan ditambahkan sebagai anggota baru.</p>
    <div class="field"><label>Pilih file .csv</label><input type="file" id="umCsvFile" accept=".csv,text/csv"></div>
    <p class="small-muted">atau tempel langsung:</p>
    <div class="field"><textarea id="umCsvPaste" rows="8" placeholder="A,9,Sudah Menikah,Cipto Budhi harto|Kepala Keluarga"></textarea></div>
    <button class="btn ochre" id="umImportBtn" style="width:100%">Proses Update</button>
    <div id="umImportResult" class="small-muted" style="margin-top:8px"></div>
  `);
  document.getElementById('umCsvFile').onchange = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    document.getElementById('umCsvPaste').value = await f.text();
  };
  document.getElementById('umImportBtn').onclick = async () => {
    const raw = document.getElementById('umCsvPaste').value.trim();
    if(!raw) return;
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    let rumahDiupdate=0, rumahTidakDitemukan=0, anggotaDiupdate=0, anggotaBaru=0;
    const touchedWarga = new Set();
    lines.forEach(line=>{
      const cols = line.split(',');
      const blok = (cols[0]||'').trim();
      const noRumah = (cols[1]||'').trim();
      const statusMaritalKK = (cols[2]||'').trim();
      const anggotaRaw = cols.slice(3).join(',').trim();
      const w = DB.warga.find(x=> (x.blok||'').toLowerCase()===blok.toLowerCase() && (x.noRumah||'').toLowerCase()===noRumah.toLowerCase());
      if(!w){ rumahTidakDitemukan++; return; }
      if(!w.anggota) w.anggota = [];
      if(anggotaRaw){
        anggotaRaw.split(';').filter(Boolean).forEach(entry=>{
          const [nama, hubungan] = entry.split('|').map(s=>(s||'').trim());
          if(!nama) return;
          let a = w.anggota.find(x=>(x.nama||'').toLowerCase()===nama.toLowerCase());
          if(a){
            if(hubungan) a.status = hubungan;
            anggotaDiupdate++;
          } else {
            a = { id:uid(), nama, status:hubungan||'', statusKK:'Dalam KK', gender:'', usia:'' };
            w.anggota.push(a);
            anggotaBaru++;
          }
          if(hubungan==='Kepala Keluarga' && statusMaritalKK) a.statusMarital = statusMaritalKK;
        });
      }
      recomputeFromAnggota(w);
      touchedWarga.add(w.id);
      rumahDiupdate++;
    });
    await save('warga');
    document.getElementById('umImportResult').innerHTML = `${touchedWarga.size} rumah berhasil diperbarui, ${rumahTidakDitemukan} baris dilewati (rumah tidak ditemukan — cek Blok/No. Rumah cocok dengan data yang sudah ada). ${anggotaDiupdate} anggota diperbarui hubungannya, ${anggotaBaru} anggota baru ditambahkan.`;
    setTimeout(()=>{ closeModal(); renderAdmin(document.getElementById('app')); }, 1800);
  };
}

function openImportModal(){
  showModal('Import Data Warga (CSV)', `
    <p class="small-muted">1 baris = 1 rumah. Sistem otomatis mengenali dua format berikut — <b>boleh dicampur dalam satu file</b>, tidak perlu pilih mode:</p>
    <p class="small-muted"><b>Format ringkas</b> (tanpa detail nama anggota, 2 kolom terakhir opsional):<br>
    <code>noRumah,kepalaKeluarga,jumlahKK,jumlahLuarKK,jumlahAnak,lakiLaki,perempuan,noHP,blok,statusTinggal</code></p>
    <p class="small-muted"><b>Format detail anggota</b> (dari rekap Google Form dsb, kolom KK/Anak/L/P dihitung otomatis):<br>
    <code>blok,noRumah,kepalaKeluarga,noHP,statusTinggal,anggota</code><br>
    Kolom <b>anggota</b>: nama dipisah <code>;</code>, tiap nama formatnya <code>Nama|Status|Gender|Usia</code> (Gender &amp; Usia boleh kosong). Contoh: <code>Budi|Kepala Keluarga||;Ani|Pasangan (Suami/Istri)||</code></p>
    <div class="field"><label>Pilih file .csv</label><input type="file" id="csvFile" accept=".csv,text/csv"></div>
    <p class="small-muted">atau tempel langsung:</p>
    <div class="field"><textarea id="csvPaste" rows="6" placeholder="A1,Budi Santoso,4,1,2,2,3,081234567890"></textarea></div>
    <button class="btn" id="importBtn" style="width:100%">Proses Import</button>
    <div id="importResult" class="small-muted" style="margin-top:8px"></div>
  `);
  document.getElementById('csvFile').onchange = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    document.getElementById('csvPaste').value = await f.text();
  };
  document.getElementById('importBtn').onclick = async () => {
    const raw = document.getElementById('csvPaste').value.trim();
    if(!raw) return;
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    let count=0;
    lines.forEach(line=>{
      if(line.includes('|')){
        // Format detail anggota: blok,noRumah,kepalaKeluarga,noHP,statusTinggal,anggota
        const cols = line.split(',');
        const blok = (cols[0]||'').trim();
        const noRumah = (cols[1]||'').trim();
        const kepalaKeluarga = (cols[2]||'').trim();
        const noHP = (cols[3]||'').trim();
        const statusTinggal = (cols[4]||'').trim();
        const anggotaRaw = cols.slice(5).join(',').trim();
        if(!noRumah) return;
        const w = { id:uid(), blok, noRumah, kepalaKeluarga, noHP, statusTinggal, jumlahKK:0, jumlahLuarKK:0, jumlahAnak:0, lakiLaki:0, perempuan:0, anggota:[] };
        if(anggotaRaw){
          anggotaRaw.split(';').filter(Boolean).forEach(a=>{
            const [nama,status,gender,usia] = a.split('|').map(s=>(s||'').trim());
            if(nama) w.anggota.push({ id:uid(), nama, status: status||'Anggota Keluarga (KK)', gender: gender||'', usia: usia||'' });
          });
        }
        recomputeFromAnggota(w);
        DB.warga.push(w);
      } else {
        // Format ringkas: noRumah,kepalaKeluarga,jumlahKK,jumlahLuarKK,jumlahAnak,lakiLaki,perempuan,noHP,blok,statusTinggal
        const p = line.split(',').map(s=>s.trim());
        if(!p[0]) return;
        DB.warga.push({ id:uid(), noRumah:p[0]||'', kepalaKeluarga:p[1]||'', jumlahKK:+p[2]||0, jumlahLuarKK:+p[3]||0, jumlahAnak:+p[4]||0, lakiLaki:+p[5]||0, perempuan:+p[6]||0, noHP:p[7]||'', blok:p[8]||'', statusTinggal:p[9]||'', anggota:[] });
      }
      count++;
    });
    await save('warga');
    document.getElementById('importResult').textContent = `${count} baris berhasil diimpor.`;
    setTimeout(()=>{ closeModal(); renderAdmin(document.getElementById('app')); }, 900);
  };
}

function openBayarCicilanModal(wargaId, onDone){
  const w = DB.warga.find(x=>x.id===wargaId);
  if(!w) return;
  const belum = DB.tagihan.filter(t=>t.wargaId===wargaId && t.status==='belum').sort((a,b)=> a.bulan===b.bulan ? 0 : a.bulan.localeCompare(b.bulan));
  if(!belum.length){ alert('Warga ini tidak punya tunggakan.'); return; }
  const totalTunggakan = belum.reduce((s,t)=>s+Number(t.nominal||0),0);
  const bulanUnik = [...new Set(belum.map(t=>t.bulan))].sort();
  showModal(`Bayar Cicilan / Sebagian — ${esc(w.blok)} / ${esc(w.noRumah)} (${esc(w.kepalaKeluarga)})`, `
    <p class="small-muted">Warga ini menunggak <b>${bulanUnik.length} bulan</b> (${bulanNama(bulanUnik[0])} – ${bulanNama(bulanUnik[bulanUnik.length-1])}), total <b>${fmtRp(totalTunggakan)}</b>.</p>
    <p class="small-muted">Masukkan nominal yang BENAR-BENAR dibayarkan warga sekarang (boleh cuma cukup untuk 1-2 bulan). Sistem otomatis melunasi tagihan dari <b>bulan paling lama menunggak dulu</b> (kategori demi kategori) sampai nominalnya habis — sisanya tetap tercatat belum bayar.</p>
    <div class="field"><label>Nominal Dibayar Sekarang</label><input type="number" id="f_cicilanNominal" placeholder="Contoh: 240000"></div>
    <div class="field"><label>Tanggal Bayar</label><input type="date" id="f_cicilanTanggal" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Metode</label><select id="f_cicilanMetode"><option value="Cash">Cash</option><option value="Transfer">Transfer</option></select></div>
    <div id="cicilanPreview" class="small-muted" style="margin:10px 0"></div>
    <button class="btn" id="prosesCicilanBtn" style="width:100%">Proses Pembayaran</button>
  `);
  const preview = () => {
    const nominal = +document.getElementById('f_cicilanNominal').value || 0;
    let sisa = nominal;
    const akanLunas = [];
    for(const t of belum){
      const jumlah = Number(t.nominal||0);
      if(sisa >= jumlah){ akanLunas.push(t); sisa -= jumlah; }
      else break;
    }
    const bulanTerbayar = [...new Set(akanLunas.map(t=>t.bulan))];
    document.getElementById('cicilanPreview').innerHTML = nominal ? `
      Dengan nominal ini, akan melunasi <b>${akanLunas.length} kategori tagihan</b> dari <b>${bulanTerbayar.length} bulan</b> (${bulanTerbayar.length? bulanNama(bulanTerbayar[0])+(bulanTerbayar.length>1?' – '+bulanNama(bulanTerbayar[bulanTerbayar.length-1]):'') : '-'}).
      ${sisa>0 && akanLunas.length<belum.length ? `<br>Sisa uang <b>${fmtRp(sisa)}</b> tidak cukup untuk kategori berikutnya, jadi tidak dipakai (kembalikan ke warga atau catat manual).` : ''}
      ${akanLunas.length===belum.length ? `<br>✅ Ini melunasi SEMUA tunggakan warga ini.` : ''}
    ` : '';
    return akanLunas;
  };
  document.getElementById('f_cicilanNominal').addEventListener('input', preview);
  document.getElementById('prosesCicilanBtn').onclick = async () => {
    const akanLunas = preview();
    if(!akanLunas.length){ alert('Nominal belum cukup untuk melunasi kategori tagihan mana pun (cek urutan bulan paling lama dulu).'); return; }
    const tanggal = document.getElementById('f_cicilanTanggal').value;
    const metode = document.getElementById('f_cicilanMetode').value;
    if(!tanggal){ alert('Isi tanggal bayar.'); return; }
    akanLunas.forEach(t=>{
      t.status = 'lunas';
      t.tanggalBayar = tanggal;
      t.metodeBayar = metode;
      t.keterangan = (t.keterangan?t.keterangan+' | ':'') + 'Dibayar via cicilan/sebagian';
      syncTagihanToKeuangan(t);
    });
    await save('tagihan');
    await save('keuangan');
    alert(`${akanLunas.length} kategori tagihan berhasil dilunasi.`);
    closeModal();
    if(onDone) onDone();
  };
}

function buildTagihanWaMessage(wargaId, bulanView, paidBulanList){
  const w = DB.warga.find(x=>x.id===wargaId);
  if(!w) return '';
  const lokasi = (w.blok?w.blok+' ':'')+w.noRumah;
  const namaKat = kid => { const k=DB.kategori.find(x=>x.id===kid); return k?k.nama:'Iuran'; };
  const semuaBelum = DB.tagihan.filter(t=>t.wargaId===wargaId && t.status==='belum').sort((a,b)=>a.bulan.localeCompare(b.bulan));
  const totalTunggakan = semuaBelum.reduce((s,t)=>s+Number(t.nominal||0),0);
  let msg = `Halo *${w.kepalaKeluarga}* (Blok ${lokasi}),\n\n`;

  // Kalau pembayaran ini mencakup lebih dari satu bulan sekaligus (mis. dari tombol
  // "Bayar Lunas" yang baru saja melunaskan beberapa bulan tunggakan dalam satu proses),
  // rangkum SEMUA bulan itu di sini, bukan cuma satu bulan.
  const bulanTerbayar = (paidBulanList && paidBulanList.length) ? [...paidBulanList].sort() : (() => {
    const r = DB.tagihan.filter(t=>t.wargaId===wargaId && t.bulan===bulanView && t.status==='lunas');
    return r.length ? [bulanView] : [];
  })();

  if(bulanTerbayar.length){
    msg += bulanTerbayar.length>1
      ? `Terima kasih 🙏 pembayaran iuran Anda untuk *${bulanTerbayar.length} bulan sekaligus* (${bulanTerbayar.map(bulanNama).join(', ')}) sudah kami terima:\n`
      : `Terima kasih 🙏 pembayaran iuran Anda untuk *${bulanNama(bulanTerbayar[0])}* sudah kami terima:\n`;
    bulanTerbayar.forEach(bln=>{
      const rows = DB.tagihan.filter(t=>t.wargaId===wargaId && t.bulan===bln && t.status==='lunas');
      if(bulanTerbayar.length>1) msg += `${bulanNama(bln)}:\n`;
      rows.forEach(t=> msg += `• ${namaKat(t.kategoriId)}: ${fmtRp(t.nominal)} — LUNAS ✅\n`);
    });
  } else {
    const bulanIniRows = DB.tagihan.filter(t=>t.wargaId===wargaId && t.bulan===bulanView);
    if(bulanIniRows.length) msg += `Berikut tagihan iuran RT untuk bulan *${bulanNama(bulanView)}*:\n`;
  }

  const bulanIniBelum = DB.tagihan.filter(t=>t.wargaId===wargaId && t.bulan===bulanView && t.status==='belum');
  if(bulanIniBelum.length && !bulanTerbayar.includes(bulanView)){
    msg += `\nUntuk bulan ${bulanNama(bulanView)} masih ada yang belum lunas:\n`;
    bulanIniBelum.forEach(t=> msg += `• ${namaKat(t.kategoriId)}: ${fmtRp(t.nominal)}\n`);
  }
  const tunggakanLain = semuaBelum.filter(t=>t.bulan!==bulanView);
  if(tunggakanLain.length){
    msg += `\nSelain itu, masih ada tunggakan bulan sebelumnya:\n`;
    tunggakanLain.forEach(t=> msg += `• ${bulanNama(t.bulan)} — ${namaKat(t.kategoriId)}: ${fmtRp(t.nominal)}\n`);
  }
  if(semuaBelum.length){
    msg += `\n*Total keseluruhan tunggakan: ${fmtRp(totalTunggakan)}*\nMohon tetap wajib dilunasi ya. Terima kasih 🙏\n`;
  } else if(bulanTerbayar.length){
    msg += `\nSemua iuran sudah lunas, tidak ada tunggakan. Terima kasih atas kepatuhannya 🙏\n`;
  }
  msg += `\n_Informasi resmi dari Pengurus ${DB.settings.rtName}_`;
  return msg;
}

function generateTagihanForWarga(wargaId, bulan){
  const w = DB.warga.find(x=>x.id===wargaId);
  if(!w) return {added:0, dilewati:0};
  let added=0, dilewati=0;
  DB.kategori.forEach(kat=>{
    const berlaku = kat.berlakuUntuk && kat.berlakuUntuk.length ? kat.berlakuUntuk : null;
    if(berlaku && w.statusTinggal && !berlaku.includes(w.statusTinggal)){ dilewati++; return; }
    const exists = DB.tagihan.find(t=>t.wargaId===wargaId && t.bulan===bulan && t.kategoriId===kat.id);
    if(!exists){ DB.tagihan.push({id:uid(), wargaId, kategoriId:kat.id, bulan, nominal:kat.nominalDefault||0, status:'belum'}); added++; }
  });
  return {added, dilewati};
}

    let created=0;
    const skippedLunas = [], skippedStatus = [];
    katIds.forEach(katId=>{
      const kat = DB.kategori.find(k=>k.id===katId);
      const berlaku = kat && kat.berlakuUntuk && kat.berlakuUntuk.length ? kat.berlakuUntuk : null;
      DB.warga.forEach(w=>{
        if(berlaku && w.statusTinggal && !berlaku.includes(w.statusTinggal)){ skippedStatus.push({w,kat}); return; }
        const existing = DB.tagihan.find(t=>t.wargaId===w.id && t.bulan===bulan && t.kategoriId===katId);
        if(existing){
          if(existing.status==='lunas') skippedLunas.push({w,kat,t:existing});
          return;
        }
        DB.tagihan.push({id:uid(), wargaId:w.id, kategoriId:katId, bulan, nominal:kat?kat.nominalDefault:0, status:'belum'});
        created++;
      });
    });
    await save('tagihan');
    document.getElementById('generateResult').innerHTML = `
      <div class="grid cols-3" style="margin-bottom:12px">
        <div class="card"><div class="stat" style="color:#047857">${created}</div><div class="stat-label">Tagihan baru dibuat</div></div>
        <div class="card"><div class="stat" style="color:var(--accent)">${skippedLunas.length}</div><div class="stat-label">Dilewati — sudah lunas (rapel/manual)</div></div>
        <div class="card"><div class="stat" style="color:var(--ink-soft)">${skippedStatus.length}</div><div class="stat-label">Dilewati — status rumah tidak sesuai</div></div>
      </div>
      ${skippedLunas.length ? `
        <h4 style="font-size:.9rem;margin-bottom:8px">✅ Rumah yang sudah lunas untuk ${bulanNama(bulan)} (tidak digenerate ulang):</h4>

      ` : ''}
    `;
    drawTable();
  };
  drawTable();
}

function openKelolaTagihanWarga(wargaId, bulan, onDone){
  const w = DB.warga.find(x=>x.id===wargaId);
  if(!w) return;
  const rows = DB.tagihan.filter(t=>t.wargaId===wargaId && t.bulan===bulan);
  showModal(`Kelola Tagihan ${esc(bulanNama(bulan))} — ${esc(w.kepalaKeluarga)} (${esc(w.blok)} ${esc(w.noRumah)})`, `
    <p class="small-muted">Menandai <b>Lunas</b> di sini otomatis mencatat pemasukan ke pembukuan Kas RT (dan sebaliknya, dihapus lagi kalau dibatalkan) — tidak perlu catat manual dua kali.</p>
    ${w.noHP ? `<button class="btn ochre" id="kelolaWaBtn" style="width:100%;margin-bottom:14px">📲 Kirim WA — Ringkasan Semua Kategori + Tunggakan</button>` : `<p class="small-muted">⚠️ No. HP warga ini belum diisi, tidak bisa kirim WA.</p>`}
    ${rows.length ? `
      <table><thead><tr><th>Kategori</th><th class="num">Nominal</th><th>Status</th><th>Tgl. Bayar</th><th></th></tr></thead>
      <tbody>${rows.map(t=>{ const kat = DB.kategori.find(k=>k.id===t.kategoriId); return `<tr>
        <td>${esc(kat?kat.nama:'(kategori dihapus)')}</td>
        <td class="num"><input type="number" style="max-width:110px;display:inline-block" data-knominal="${t.id}" value="${t.nominal}"></td>
        <td><select data-kstatus="${t.id}"><option value="belum" ${t.status==='belum'?'selected':''}>Belum Bayar</option><option value="lunas" ${t.status==='lunas'?'selected':''}>Lunas</option></select></td>
        <td><input type="date" style="max-width:140px" data-ktanggal="${t.id}" value="${t.tanggalBayar||new Date().toISOString().slice(0,10)}"></td>
        <td><button class="btn sm brick" data-kdel="${t.id}">Hapus</button></td>
      </tr>`; }).join('')}</tbody></table>
      <button class="btn" id="saveKelolaBtn" style="width:100%;margin-top:12px">Simpan Semua</button>
    ` : '<div class="empty">Belum ada tagihan untuk warga ini di bulan tersebut. Generate dulu lewat panel di atas.</div>'}
  `);
  const waBtn = document.getElementById('kelolaWaBtn');
  if(waBtn) waBtn.onclick = () => window.open(waLink(w.noHP, buildTagihanWaMessage(wargaId, bulan)), '_blank');
  document.querySelectorAll('[data-kdel]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Hapus kategori tagihan ini untuk warga ini?')) return;
    const t = DB.tagihan.find(x=>x.id===b.dataset.kdel);
    const idx = DB.keuangan.findIndex(k=>k.sumberTagihanId===t.id);
    let keuanganIdToDelete = null;
    if(idx>=0 && !isBulanLocked(DB.keuangan[idx].tanggal.slice(0,7))){ keuanganIdToDelete = DB.keuangan[idx].id; DB.keuangan.splice(idx,1); }
    DB.tagihan = DB.tagihan.filter(x=>x.id!==t.id);
    await deleteRowFromDB('tagihan', t.id);
    if(keuanganIdToDelete) await deleteRowFromDB('keuangan', keuanganIdToDelete);
    closeModal();
    openKelolaTagihanWarga(wargaId, bulan, onDone);
  });
  const btn = document.getElementById('saveKelolaBtn');
  if(btn) btn.onclick = async () => {
    rows.forEach(t=>{
      t.nominal = +document.querySelector(`[data-knominal="${t.id}"]`).value||0;
      t.status = document.querySelector(`[data-kstatus="${t.id}"]`).value;
      t.tanggalBayar = document.querySelector(`[data-ktanggal="${t.id}"]`).value;
      syncTagihanToKeuangan(t);
    });
    await save('tagihan');
    await save('keuangan');
    closeModal();
    if(onDone) onDone();
  };
}

function monthRange(start, end){
  const out = [];
  let [y,m] = start.split('-').map(Number);
  const [ey,em] = end.split('-').map(Number);
  while(y<ey || (y===ey && m<=em)){
    out.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){m=1; y++;}
  }
  return out;
}

          document.getElementById('ub_searchRumah').value = aiResult.namaPengirim;

        }
      }
    }
  };

  const drawRumahList = (query) => {
    const q = (query||'').toLowerCase();
    const rows = sortWarga(DB.warga).filter(w=> !q || (w.kepalaKeluarga+' '+w.blok+' '+w.noRumah).toLowerCase().includes(q));
    document.getElementById('ub_listRumah').innerHTML = rows.length ? rows.slice(0,80).map(w=>`
      <div data-pilihub="${w.id}" style="padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--line); ${w.id===selectedWargaId?'background:var(--primary-light)':''}">
        <b>${esc(w.blok?w.blok+' ':'')}${esc(w.noRumah)}</b> — ${esc(w.kepalaKeluarga)}
      </div>`).join('') : '<div class="empty" style="padding:10px">Tidak ketemu.</div>';
    document.querySelectorAll('[data-pilihub]').forEach(elm=>elm.onclick=()=>{ selectedWargaId = elm.dataset.pilihub; pilihRumahUb(selectedWargaId); });
  };
  document.getElementById('ub_searchRumah').addEventListener('input', e=>drawRumahList(e.target.value));
  drawRumahList('');

  const pilihRumahUb = (id) => {
    const w = DB.warga.find(x=>x.id===id);
    drawRumahList(document.getElementById('ub_searchRumah').value);
    document.getElementById('ub_rumahTerpilih').innerHTML = `Rumah dipilih: <b>${esc(w.blok)} ${esc(w.noRumah)} — ${esc(w.kepalaKeluarga)}</b>`;
    const belum = DB.tagihan.filter(t=>t.wargaId===id && t.status==='belum').sort((a,b)=>a.bulan.localeCompare(b.bulan));
    if(!belum.length){
      document.getElementById('ub_kategoriWrap').innerHTML = '<p class="small-muted">Rumah ini tidak punya tunggakan sama sekali.</p>';
      document.getElementById('ub_saveBtn').disabled = true;
      document.getElementById('ub_saveBtn').textContent = 'Tidak ada tunggakan';
      return;
    }
    // pra-centang otomatis dari bulan paling lama sampai kira-kira sesuai nominal yang terbaca AI (kalau ada)
    let sisa = aiResult && aiResult.nominal ? Number(aiResult.nominal) : null;
    document.getElementById('ub_kategoriWrap').innerHTML = `
      <p class="small-muted">Centang tagihan yang dibayar lewat bukti ini (bulan paling lama otomatis dicentang duluan kalau nominal AI terbaca):</p>
      <div style="max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px">
        ${belum.map(t=>{
          const kat = DB.kategori.find(k=>k.id===t.kategoriId);
          let checked = true;
          if(sisa !== null){ checked = sisa >= Number(t.nominal||0); if(checked) sisa -= Number(t.nominal||0); }
          return `<label style="display:flex;justify-content:space-between;gap:8px;text-transform:none;font-size:.85rem;color:var(--ink);margin-bottom:6px"><span><input type="checkbox" class="ubCheck" value="${t.id}" ${checked?'checked':''} style="width:auto;margin-right:8px">${bulanNama(t.bulan)} — ${esc(kat?kat.nama:'-')}</span><b>${fmtRp(t.nominal)}</b></label>`;
        }).join('')}
      </div>
    `;
    document.getElementById('ub_saveBtn').disabled = false;
    document.getElementById('ub_saveBtn').textContent = '✅ Simpan & Tandai Lunas';
  };

  document.getElementById('ub_saveBtn').onclick = async () => {
    const checkedIds = Array.from(document.querySelectorAll('.ubCheck:checked')).map(c=>c.value);
    if(!checkedIds.length){ alert('Pilih minimal satu tagihan.'); return; }
    const tanggal = document.getElementById('ub_tanggal').value;
    if(!tanggal){ alert('Isi tanggal bayar.'); return; }
    checkedIds.forEach(tid=>{
      const t = DB.tagihan.find(x=>x.id===tid);
      t.status='lunas'; t.tanggalBayar=tanggal; t.metodeBayar='transfer'; if(buktiBase64) t.buktiTransfer=buktiBase64;
      t.keterangan = (t.keterangan?t.keterangan+' | ':'') + 'Dibayar via upload bukti transfer' + (hasAiKey?' (auto-isi AI)':'');
      syncTagihanToKeuangan(t);
    });
    document.getElementById('ub_saveBtn').textContent = 'Menyimpan...';
    document.getElementById('ub_saveBtn').disabled = true;
    try{ await save('tagihan'); await save('keuangan'); }
    catch(e){ alert('Gagal menyimpan — mungkin ukuran foto terlalu besar. Coba foto lebih kecil.'); document.getElementById('ub_saveBtn').disabled=false; document.getElementById('ub_saveBtn').textContent='✅ Simpan & Tandai Lunas'; return; }
    document.getElementById('ub_saveBtn').style.display = 'none';
    document.getElementById('ub_result').innerHTML = `<div class="badge lunas" style="display:block;padding:10px;text-align:center">✅ ${checkedIds.length} tagihan berhasil ditandai lunas</div>`;
    if(onDone) onDone();
  };
}

async function bacaBuktiViaAI(base64Image, tipe){
  const apiKey = localStorage.getItem('rtAiApiKey');
  if(!apiKey) return null;
  const m = /^data:image\/(png|jpe?g|webp);base64,(.+)$/i.exec(base64Image);
  if(!m) return null;
  const mediaType = 'image/' + (m[1].toLowerCase()==='jpg'?'jpeg':m[1].toLowerCase());
  const b64data = m[2];
  const instruksi = tipe==='pengeluaran'
    ? `Ini foto struk/bukti pengeluaran kas RT. Baca dan kembalikan HANYA JSON (tanpa teks lain, tanpa markdown) dengan field: {"nominal": <angka rupiah tanpa titik/koma, atau null kalau tidak kelihatan>, "tanggal": "<YYYY-MM-DD kalau kelihatan, atau null>", "deskripsi": "<ringkasan singkat untuk apa pengeluaran ini, atau null>"}`
    : `Ini foto bukti transfer pembayaran iuran RT (screenshot m-banking/e-wallet). Baca dan kembalikan HANYA JSON (tanpa teks lain, tanpa markdown) dengan field: {"nominal": <angka rupiah tanpa titik/koma, atau null kalau tidak kelihatan>, "tanggal": "<YYYY-MM-DD kalau kelihatan, atau null>", "namaPengirim": "<nama pengirim/pembayar kalau kelihatan, atau null>", "namaPenerima": "<nama penerima kalau kelihatan, atau null>"}`;
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 300,
        messages: [{ role:'user', content: [
          { type:'image', source:{ type:'base64', media_type: mediaType, data: b64data } },
          { type:'text', text: instruksi }
        ]}]
      })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message||'AI error');
    const text = (data.content||[]).map(c=>c.text||'').join('').trim();
    const cleaned = text.replace(/```json|```/g,'').trim();
    return JSON.parse(cleaned);
  }catch(e){
    console.error('Gagal baca bukti via AI', e);
    return { _error: e.message || 'Gagal membaca gambar' };
  }
}

function getKategoriIcon(nama){
  const n = (nama||'').toLowerCase();
  if(n.includes('sampah') || n.includes('dlh')) return '🗑️';
  if(n.includes('keamanan') || n.includes('satpam') || n.includes('security')) return '🛡️';
  if(n.includes('kebersihan')) return '🧹';
  if(n.includes('sosial')) return '🤝';
  if(n.includes('keduka') || n.includes('duka')) return '🕊️';
  if(n.includes('gaji') || n.includes('petugas') || n.includes('honor')) return '💵';
  if(n.includes('fasum') || n.includes('fasilitas')) return '🏞️';
  if(n.includes('lebaran') || n.includes('hadiah') || n.includes('acrrue') || n.includes('thr')) return '🎁';
  if(n.includes('talangan')) return '🔄';
  if(n.includes('csr') || n.includes('sponsor')) return '🎗️';
  if(n.includes('kas rt') || n.includes('operasional')) return '🏠';
  return '💰';
}

function computeSaldo(){
  const total = DB.keuangan.reduce((s,k)=>s+(k.jenis==='masuk'?Number(k.jumlah):-Number(k.jumlah)),0);
  const perKategori = {};
  DB.keuangan.forEach(k=>{ perKategori[k.kategori] = (perKategori[k.kategori]||0) + (k.jenis==='masuk'?Number(k.jumlah):-Number(k.jumlah)); });
  const list = Object.keys(perKategori).map(nama=>({nama, saldo:perKategori[nama]})).sort((a,b)=>b.saldo-a.saldo);
  return { total, list };
}

  const drawTrx = () => {

    const katFilter = document.getElementById('trxKategoriSel').value;

      .filter(t=> semua || t.tanggal.startsWith(bulanFilter))
      .filter(t=> !jenisFilter || t.jenis===jenisFilter)
      .filter(t=> !katFilter || t.kategori===katFilter)
      .sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
    const totalMasuk = rows.filter(t=>t.jenis==='masuk').reduce((s,t)=>s+Number(t.jumlah),0);
    const totalKeluar = rows.filter(t=>t.jenis==='keluar').reduce((s,t)=>s+Number(t.jumlah),0);
    document.getElementById('trxTableWrap').innerHTML = `
      <div class="pill-row" style="margin-bottom:10px">
        <span class="badge lunas">Pemasukan (tampil): ${fmtRp(totalMasuk)}</span>
        <span class="badge belum">Pengeluaran (tampil): ${fmtRp(totalKeluar)}</span>
      </div>
      <table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th class="num">Jumlah</th><th></th></tr></thead>
      <tbody>${rows.map(t=>{ const locked = isBulanLocked(t.tanggal.slice(0,7)); return `<tr>
        <td>${esc(t.tanggal)}</td><td><span class="badge ${t.jenis==='masuk'?'lunas':'belum'}">${t.jenis}</span></td><td>${esc(t.kategori)}</td><td>${esc(t.keterangan||'-')}</td>
        <td class="num ${t.jenis==='masuk'?'money-in':'money-out'}">${fmtRp(t.jumlah)}</td>
        <td>${locked ? '<span class="small-muted">🔒 terkunci</span>' : `<button class="btn sm outline" data-edit="${t.id}">Edit</button> <button class="btn sm brick" data-del="${t.id}">Hapus</button>`}</td>
      </tr>`; }).join('') || '<tr><td colspan="6" class="empty">Belum ada transaksi untuk filter ini.</td></tr>'}</tbody></table>
    `;
    el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTrxModal(b.dataset.edit));
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(confirm('Hapus transaksi ini?')){ DB.keuangan=DB.keuangan.filter(t=>t.id!==b.dataset.del); await deleteRowFromDB('keuangan', b.dataset.del); await save('keuangan'); drawTrx(); }});

  document.getElementById('trxTahunSel').onchange = drawTrx;
  document.getElementById('trxSemuaBulan').onchange = drawTrx;
  document.getElementById('trxJenisSel').onchange = drawTrx;
  document.getElementById('trxKategoriSel').onchange = drawTrx;
