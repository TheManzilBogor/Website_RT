  document.getElementById('kuTahunSel').onchange = (e)=>{ window._kuBulan = document.getElementById('kuTahunSel').value+'-'+document.getElementById('kuBulanSel').value; renderAdmin(document.getElementById('app')); };
  const lockBtn = document.getElementById('lockBtn');
  if(lockBtn) lockBtn.onclick = async () => {
    const catatan = prompt('Catatan pengesahan (opsional), misal "Disepakati rapat pengurus 25 Agustus 2026":') || '';
    DB.settings.laporanLock = DB.settings.laporanLock || {};
    DB.settings.laporanLock[window._kuBulan] = { locked:true, tanggal:new Date().toISOString().slice(0,10), catatan };
    await save('settings');
    renderAdmin(document.getElementById('app'));
  };
  const unlockBtn = document.getElementById('unlockBtn');
  if(unlockBtn) unlockBtn.onclick = async () => {
    if(!confirm('Buka kunci bulan ini? Data akan bisa diubah lagi.')) return;
    DB.settings.laporanLock[window._kuBulan] = { locked:false };
    await save('settings');
    renderAdmin(document.getElementById('app'));
  };
  document.getElementById('addTrxBtn').onclick = () => openTrxModal(null);
  document.getElementById('importKuBtn').onclick = () => openImportKeuanganModal(drawTrx);
  document.getElementById('uploadBuktiKeluarBtn').onclick = () => openUploadBuktiKeluarModal(drawTrx);
  document.getElementById('downloadKuPdfBtn').onclick = () => {
    const bulan = document.getElementById('trxTahunSel').value + '-' + document.getElementById('trxBulanSel').value;
    const trx = DB.keuangan.filter(k=>k.tanggal.startsWith(bulan)).sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
    const masuk = trx.filter(t=>t.jenis==='masuk').reduce((s,t)=>s+Number(t.jumlah),0);
    const keluar = trx.filter(t=>t.jenis==='keluar').reduce((s,t)=>s+Number(t.jumlah),0);
    const saldoSemua = {};
    DB.keuangan.filter(k=>k.tanggal.slice(0,7)<=bulan).forEach(k=>{ saldoSemua[k.kategori]=(saldoSemua[k.kategori]||0)+(k.jenis==='masuk'?Number(k.jumlah):-Number(k.jumlah)); });
    downloadLaporanPdf(bulan, trx, masuk, keluar, saldoSemua);
  };
  const kuWordBtn = document.getElementById('downloadKuWordBtn');
  if(kuWordBtn) kuWordBtn.onclick = () => {
    const bulan = document.getElementById('trxTahunSel').value + '-' + document.getElementById('trxBulanSel').value;
    const trx = DB.keuangan.filter(k=>k.tanggal.startsWith(bulan)).sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
    const masuk = trx.filter(t=>t.jenis==='masuk').reduce((s,t)=>s+Number(t.jumlah),0);
    const keluar = trx.filter(t=>t.jenis==='keluar').reduce((s,t)=>s+Number(t.jumlah),0);
    downloadLaporanKeuanganDocx(bulan, trx, masuk, keluar);
  };
  document.getElementById('downloadKuXlsBtn').onclick = () => {
    const semua = document.getElementById('trxSemuaBulan').checked;
    const bulan = document.getElementById('trxTahunSel').value + '-' + document.getElementById('trxBulanSel').value;
    const trx = semua ? [...DB.keuangan] : DB.keuangan.filter(k=>k.tanggal.startsWith(bulan));
    exportKeuanganXlsx(trx, semua ? 'Semua Periode' : bulanNama(bulan));
  };
  drawTrx();
}
function openTrxModal(id){
  const t = id ? DB.keuangan.find(x=>x.id===id) : {id:uid(), tanggal:new Date().toISOString().slice(0,10), jenis:'masuk', kategori:'', keterangan:'', jumlah:0};
  if(id && isBulanLocked(t.tanggal.slice(0,7))){ alert('Bulan ini sudah disahkan & terkunci. Buka kunci dulu di panel Pengesahan jika benar-benar perlu mengubah.'); return; }
  const sumberLain = ['CSR','Sponsorship','Dana Talangan Warga'];
  const isCustomKat = t.kategori && !DB.kategori.some(k=>k.nama===t.kategori) && !sumberLain.includes(t.kategori);
  showModal(`${id?'Edit':'Tambah'} Transaksi`, `
    <div class="form-row">
      <div class="field"><label>Tanggal</label><input type="date" id="f_tanggal" value="${t.tanggal}"></div>
      <div class="field"><label>Jenis</label><select id="f_jenis"><option value="masuk" ${t.jenis==='masuk'?'selected':''}>Pemasukan</option><option value="keluar" ${t.jenis==='keluar'?'selected':''}>Pengeluaran</option></select></div>
    </div>
    <div class="field"><label>Kategori</label>
      <select id="f_kategori">
        <option value="">- Pilih Kategori -</option>
        ${DB.kategori.length ? `<optgroup label="Sumber: Iuran Warga (per Kategori Iuran)">${DB.kategori.map(k=>`<option value="${esc(k.nama)}" ${t.kategori===k.nama?'selected':''}>${esc(k.nama)}</option>`).join('')}</optgroup>` : ''}
        <optgroup label="Sumber Lain">${sumberLain.map(s=>`<option value="${s}" ${t.kategori===s?'selected':''}>${s}</option>`).join('')}</optgroup>
        <option value="__lainnya__" ${isCustomKat?'selected':''}>Lainnya (tulis manual)</option>
      </select>
    </div>
    <div class="field" id="f_kategoriCustomWrap" style="display:${isCustomKat?'block':'none'}"><label>Nama Kategori Lainnya</label><input id="f_kategoriCustom" value="${isCustomKat?esc(t.kategori):''}" placeholder="Contoh: Kebersihan, Keamanan"></div>
    <div class="field"><label>Keterangan</label><input id="f_ket" value="${esc(t.keterangan)}"></div>
    <div class="field"><label>Jumlah (Rp)</label><input type="number" id="f_jumlah" value="${t.jumlah}"></div>
    <button class="btn" id="saveTrxBtn" style="width:100%">Simpan</button>
  `);
  document.getElementById('f_kategori').onchange = (e) => {
    document.getElementById('f_kategoriCustomWrap').style.display = e.target.value==='__lainnya__' ? 'block' : 'none';
  };
  document.getElementById('saveTrxBtn').onclick = async () => {
    const newTanggal = document.getElementById('f_tanggal').value;
    if(isBulanLocked(newTanggal.slice(0,7))){ alert('Bulan tujuan tanggal ini sudah disahkan & terkunci. Pilih tanggal di bulan lain, atau buka kunci dulu.'); return; }
    t.tanggal = newTanggal;
    t.jenis = document.getElementById('f_jenis').value;
    const katSel = document.getElementById('f_kategori').value;
    t.kategori = katSel==='__lainnya__' ? document.getElementById('f_kategoriCustom').value.trim() : katSel;
    t.keterangan = document.getElementById('f_ket').value.trim();
    t.jumlah = +document.getElementById('f_jumlah').value||0;
    if(!t.kategori){ alert('Kategori wajib diisi'); return; }
    if(!id) DB.keuangan.push(t);
    await save('keuangan'); closeModal(); renderAdmin(document.getElementById('app'));
  };
}

function openUploadBuktiKeluarModal(onDone){
  const hasAiKey = !!localStorage.getItem('rtAiApiKey');
  const kategoriOpts = [...DB.kategori.map(k=>k.nama), 'CSR', 'Sponsorship', 'Dana Talangan Warga', 'Biaya Admin Bank', 'Lainnya'];
  showModal('📷 Upload Bukti Pengeluaran (Auto-Isi)', `
    <p class="small-muted">Upload foto struk/bukti pengeluaran kas RT. ${hasAiKey ? 'AI akan coba baca nominal, tanggal, dan deskripsinya otomatis — tetap cek ulang sebelum disimpan.' : 'AI belum aktif (API Key belum diisi di Pengaturan), jadi isi datanya manual di bawah.'}</p>
    <div class="field"><label>Foto Bukti Pengeluaran</label><input type="file" id="uk_foto" accept="image/*"></div>
    <div id="uk_preview" style="margin-bottom:12px"></div>
    <div id="uk_aiStatus" class="small-muted" style="margin-bottom:10px"></div>
    <div class="form-row">
      <div class="field"><label>Tanggal</label><input type="date" id="uk_tanggal" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Nominal (Rp)</label><input type="number" id="uk_nominal" placeholder="0"></div>
    </div>
    <div class="field"><label>Kategori</label><select id="uk_kategori">${kategoriOpts.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('')}</select></div>
    <div class="field"><label>Keterangan</label><input type="text" id="uk_keterangan" placeholder="Untuk apa pengeluaran ini"></div>
    <button class="btn" id="uk_saveBtn" style="width:100%">✅ Simpan Sebagai Pengeluaran</button>
    <div id="uk_result" style="margin-top:12px"></div>
  `);
  let buktiBase64 = '';
  document.getElementById('uk_foto').onchange = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    buktiBase64 = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
    document.getElementById('uk_preview').innerHTML = `<img src="${buktiBase64}" style="max-width:200px;max-height:200px;border-radius:8px;border:1px solid var(--line)">`;
    if(hasAiKey){
      document.getElementById('uk_aiStatus').textContent = '🤖 Membaca gambar...';
      const r = await bacaBuktiViaAI(buktiBase64, 'pengeluaran');
      if(!r || r._error){
        document.getElementById('uk_aiStatus').textContent = '⚠️ AI gagal membaca gambar ini. Isi manual di bawah.';
      } else {
        document.getElementById('uk_aiStatus').innerHTML = `✅ AI membaca: ${r.nominal?fmtRp(r.nominal):'nominal tidak terbaca'}${r.tanggal?(' pada '+r.tanggal):''}${r.deskripsi?(' — '+esc(r.deskripsi)):''}. <b>Cek ulang sebelum simpan.</b>`;
        if(r.nominal) document.getElementById('uk_nominal').value = r.nominal;
        if(r.tanggal && /^\d{4}-\d{2}-\d{2}$/.test(r.tanggal)) document.getElementById('uk_tanggal').value = r.tanggal;
        if(r.deskripsi) document.getElementById('uk_keterangan').value = r.deskripsi;
      }
    }
  };
  document.getElementById('uk_saveBtn').onclick = async () => {
    const tanggal = document.getElementById('uk_tanggal').value;
    const nominal = +document.getElementById('uk_nominal').value || 0;
    const kategori = document.getElementById('uk_kategori').value;
    const keterangan = document.getElementById('uk_keterangan').value.trim();
    if(!tanggal || !nominal){ alert('Isi tanggal dan nominal.'); return; }
    if(isBulanLocked(tanggal.slice(0,7))){ alert('Bulan ini sudah dikunci pengurus, tidak bisa tambah transaksi baru.'); return; }
    const trx = { id:uid(), tanggal, jenis:'keluar', kategori, keterangan: keterangan + (buktiBase64?' [ada foto bukti]':''), jumlah: nominal };
    DB.keuangan.push(trx);
    document.getElementById('uk_saveBtn').textContent = 'Menyimpan...';
    document.getElementById('uk_saveBtn').disabled = true;
    try{ await save('keuangan'); }
    catch(e){ alert('Gagal menyimpan.'); document.getElementById('uk_saveBtn').disabled=false; document.getElementById('uk_saveBtn').textContent='✅ Simpan Sebagai Pengeluaran'; return; }
    document.getElementById('uk_saveBtn').style.display = 'none';
    document.getElementById('uk_result').innerHTML = `<div class="badge belum" style="display:block;padding:10px;text-align:center">✅ Pengeluaran ${fmtRp(nominal)} berhasil dicatat</div>`;
    if(onDone) onDone();
  };
}

function openImportKeuanganModal(onDone){
  showModal('Import Rekap Keuangan (CSV)', `
    <p class="small-muted">Untuk rekap kas manual Anda sebelum pakai website ini. 1 baris = 1 transaksi. Kolom (dipisah koma), tanpa header:<br>
    <code>tanggal,jenis,kategori,keterangan,jumlah</code></p>
    <p class="small-muted"><b>tanggal</b> format YYYY-MM-DD · <b>jenis</b>: masuk atau keluar · <b>kategori</b>: nama bebas (idealnya samakan dengan nama Kategori Iuran, atau CSR/Sponsorship/Dana Talangan Warga, supaya saldo per kategori terhitung rapi) · <b>jumlah</b>: angka tanpa titik/koma.</p>
    <p class="small-muted">Contoh: <code>2026-01-10,masuk,Kas RT,Iuran Januari blok A,500000</code></p>
    <div class="field"><label>Pilih file .csv</label><input type="file" id="kuCsvFile" accept=".csv,text/csv"></div>
    <p class="small-muted">atau tempel langsung:</p>
    <div class="field"><textarea id="kuCsvPaste" rows="8" placeholder="2026-01-10,masuk,Kas RT,Iuran Januari blok A,500000"></textarea></div>
    <button class="btn ochre" id="kuImportBtn" style="width:100%">Proses Import</button>
    <div id="kuImportResult" class="small-muted" style="margin-top:8px"></div>
  `);
  document.getElementById('kuCsvFile').onchange = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    document.getElementById('kuCsvPaste').value = await f.text();
  };
  document.getElementById('kuImportBtn').onclick = async () => {
    const raw = document.getElementById('kuCsvPaste').value.trim();
    if(!raw) return;
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    let ok=0, gagal=0, terkunci=0;
    lines.forEach(line=>{
      const p = line.split(',').map(s=>s.trim());
      const [tanggal, jenis, kategori, keterangan, jumlah] = p;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(tanggal) || !['masuk','keluar'].includes(jenis) || !kategori){ gagal++; return; }
      if(isBulanLocked(tanggal.slice(0,7))){ terkunci++; return; }
      DB.keuangan.push({ id:uid(), tanggal, jenis, kategori, keterangan: keterangan||'', jumlah: +jumlah||0 });
      ok++;
    });
    await save('keuangan');
    document.getElementById('kuImportResult').textContent = `${ok} transaksi berhasil diimpor, ${gagal} baris dilewati (format salah), ${terkunci} baris dilewati (bulan sudah terkunci).`;
    setTimeout(()=>{ closeModal(); renderAdmin(document.getElementById('app')); if(onDone) onDone(); }, 1200);
  };
}

    <p class="small-muted" style="margin-top:-8px">Idealnya foto tanda tangan di atas kertas putih polos, atau hasil scan/tanda tangan digital transparan (PNG).</p>
    <div id="strukTtdPreview" style="margin-bottom:12px">${s.ttd ? `<img src="${s.ttd}" style="height:40px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:4px;border-radius:6px"> <button class="btn sm brick" id="removeStrukTtdBtn" style="vertical-align:top;margin-left:8px">Hapus Tanda Tangan</button>` : '<span class="small-muted">Belum ada tanda tangan. Kalau kosong, PDF hanya menampilkan garis kosong untuk ditandatangani manual.</span>'}</div>
    <button class="btn" id="saveStrukBtn" style="width:100%">Simpan</button>
  `);
  let pendingFoto = s.foto || '';
  let removeFoto = false;
  document.getElementById('f_foto').onchange = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    pendingFoto = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
    removeFoto = false;
  };
  const removeBtn = document.getElementById('removeStrukFotoBtn');
  if(removeBtn) removeBtn.onclick = () => { pendingFoto=''; removeFoto=true; document.getElementById('strukFotoPreview').innerHTML = '<span class="small-muted">Foto akan dihapus setelah disimpan.</span>'; };
  let pendingTtd = s.ttd || '';
  let removeTtd = false;
  document.getElementById('f_ttd').onchange = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    pendingTtd = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
    removeTtd = false;
  };
  const removeTtdBtn = document.getElementById('removeStrukTtdBtn');
  if(removeTtdBtn) removeTtdBtn.onclick = () => { pendingTtd=''; removeTtd=true; document.getElementById('strukTtdPreview').innerHTML = '<span class="small-muted">Tanda tangan akan dihapus setelah disimpan.</span>'; };
  document.getElementById('saveStrukBtn').onclick = async () => {
    s.jabatan = document.getElementById('f_jab').value.trim();
    s.nama = document.getElementById('f_nm').value.trim();
    s.noHP = document.getElementById('f_strukHp').value.trim();
    s.blok = document.getElementById('f_strukBlok').value.trim();
    s.alamat = document.getElementById('f_strukAlamat').value.trim();
    s.foto = removeFoto ? '' : pendingFoto;
    s.ttd = removeTtd ? '' : pendingTtd;
    if(!s.jabatan || !s.nama){ alert('Lengkapi jabatan dan nama'); return; }
    if(!id) DB.struktur.push(s);
    try{ await save('struktur'); }
    catch(e){ alert('Gagal menyimpan — kemungkinan ukuran foto/tanda tangan terlalu besar. Coba file yang lebih kecil.'); return; }
    closeModal(); renderAdmin(document.getElementById('app'));
  };
}

function openImportTataTertibModal(){
  showModal('Import Massal Tata Tertib', `
    <p class="small-muted">Untuk upload dokumen peraturan lengkap sekaligus, otomatis terbagi per BAB/kategori. Format: tiap poin dipisah baris <code>###</code>. Dalam 1 blok: baris 1 = Kategori (nama BAB), baris 2 = Judul (nama Pasal), baris berikutnya = isi lengkap, sampai ketemu <code>###</code> lagi.</p>
    <p class="small-muted">Contoh:<br><code>KETENTUAN UMUM<br>Pasal 1 — Nama<br>Organisasi ini bernama...<br>###<br>KETENTUAN UMUM<br>Pasal 2 — Waktu dan Kedudukan<br>RT 06 RW 06 didirikan pada...<br>###</code></p>
    <div class="field"><label>Pilih file (.txt)</label><input type="file" id="ttCsvFile" accept=".txt,text/plain"></div>
    <p class="small-muted">atau tempel langsung:</p>
    <div class="field"><textarea id="ttCsvPaste" rows="8" placeholder="KETENTUAN UMUM&#10;Pasal 1 — Nama&#10;Isi pasal...&#10;###"></textarea></div>
    <div class="field"><label><input type="checkbox" id="ttHapusLama" style="width:auto;display:inline-block;margin-right:6px"> Hapus semua poin tata tertib lama sebelum import (mengganti total, bukan menambah)</label></div>
    <button class="btn ochre" id="ttImportBtn" style="width:100%">Proses Import</button>
    <div id="ttImportResult" class="small-muted" style="margin-top:8px"></div>
  `);
  document.getElementById('ttCsvFile').onchange = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    document.getElementById('ttCsvPaste').value = await f.text();
  };
  document.getElementById('ttImportBtn').onclick = async () => {
    const raw = document.getElementById('ttCsvPaste').value.trim();
    if(!raw) return;
    if(document.getElementById('ttHapusLama').checked) DB.tatatertib = [];
    const blocks = raw.split(/\n###\n?/).map(b=>b.trim()).filter(Boolean);
    let ok=0, gagal=0;
    let urutan = DB.tatatertib.length;
    blocks.forEach(block=>{
      const lines = block.split('\n');
      if(lines.length<3){ gagal++; return; }
      const kategori = lines[0].trim();
      const judul = lines[1].trim();
      const isi = lines.slice(2).join('\n').trim();
      if(!kategori || !judul || !isi){ gagal++; return; }
      urutan++;
      DB.tatatertib.push({ id:uid(), kategori, judul, isi, urutan });
      ok++;
    });
    await save('tatatertib');
    document.getElementById('ttImportResult').textContent = `${ok} poin berhasil diimpor, ${gagal} blok dilewati (format tidak lengkap).`;
    setTimeout(()=>{ closeModal(); renderAdmin(document.getElementById('app')); }, 1200);
  };
}

function openTtModal(id){
  const t = id ? DB.tatatertib.find(x=>x.id===id) : {id:uid(), kategori:'Umum', judul:'', isi:'', urutan:(DB.tatatertib.length+1)};
  const existingKategori = [...new Set(DB.tatatertib.map(x=>x.kategori))];
  const defaultOpts = ['Umum','Keamanan','Kebersihan','Kemasyarakatan','Sanksi'];
  const kategoriOpts = [...new Set([...existingKategori, ...defaultOpts])];
  const isCustomKat = t.kategori && !kategoriOpts.includes(t.kategori);
  showModal(`${id?'Edit':'Tambah'} Poin Tata Tertib`, `
    <div class="form-row">
      <div class="field"><label>Kategori</label><select id="f_ttkat">${kategoriOpts.map(k=>`<option ${t.kategori===k?'selected':''}>${esc(k)}</option>`).join('')}<option value="__baru__" ${isCustomKat?'selected':''}>+ Kategori Baru...</option></select></div>
      <div class="field" id="f_ttkatCustomWrap" style="display:${isCustomKat?'block':'none'}"><label>Nama Kategori Baru</label><input id="f_ttkatCustom" value="${isCustomKat?esc(t.kategori):''}"></div>
      <div class="field"><label>Urutan Tampil</label><input type="number" id="f_tturut" value="${t.urutan||0}"></div>
    </div>
    <div class="field"><label>Judul</label><input id="f_ttjudul" value="${esc(t.judul)}" placeholder="Contoh: Jam Bertamu, Iuran Wajib, dll"></div>
    <div class="field"><label>Isi</label><textarea id="f_ttisi" rows="8">${esc(t.isi)}</textarea></div>
    <button class="btn" id="saveTtBtn" style="width:100%">Simpan</button>
  `);
  document.getElementById('f_ttkat').onchange = (e) => {
    document.getElementById('f_ttkatCustomWrap').style.display = e.target.value==='__baru__' ? 'block' : 'none';
  };
  document.getElementById('saveTtBtn').onclick = async () => {
    t.kategori = document.getElementById('f_ttkat').value==='__baru__' ? document.getElementById('f_ttkatCustom').value.trim() : document.getElementById('f_ttkat').value;
    t.urutan = +document.getElementById('f_tturut').value||0;

    if(!t.judul){ alert('Judul wajib diisi'); return; }
    if(!id) DB.tatatertib.push(t);
    await save('tatatertib'); closeModal(); renderAdmin(document.getElementById('app'));
  };
}

function openSuratKeluarModal(prefill, onDone){
  const jenisOpts = ['Surat Pengantar Domisili','Surat Keterangan Tidak Mampu','Surat Pengantar Usaha','Surat Undangan','Surat Pemberitahuan','Surat Keterangan Lainnya'];
  showModal('✉️ Buat Surat Keluar', `
    <div class="field"><label>Jenis Surat</label><select id="sk_jenis">${jenisOpts.map(j=>`<option ${prefill&&prefill.jenisSurat===j?'selected':''}>${j}</option>`).join('')}<option value="__custom__" ${prefill&&!jenisOpts.includes(prefill.jenisSurat)?'selected':''}>Lainnya (ketik manual)</option></select></div>
    <div class="field" id="sk_jenisCustomWrap" style="display:none"><label>Jenis Surat (manual)</label><input id="sk_jenisCustom" value="${prefill&&!jenisOpts.includes(prefill.jenisSurat)?esc(prefill.jenisSurat):''}"></div>
    <div class="field"><label>Kepada / Tujuan Surat</label><input id="sk_kepada" placeholder="Nama warga, atau instansi eksternal" value="${prefill?esc(prefill.kepada||''):''}"></div>
    <div class="field"><label>Perihal</label><input id="sk_perihal" value="${prefill?esc(prefill.perihal||''):''}"></div>
    <div class="field"><label>Isi Surat</label><textarea id="sk_isi" rows="8" placeholder="Isi lengkap surat...">${prefill?esc(prefill.isi||''):''}</textarea></div>
    <div class="field"><label>Tanggal Surat</label><input type="date" id="sk_tanggal" value="${new Date().toISOString().slice(0,10)}"></div>
    <button class="btn" id="sk_saveBtn" style="width:100%">Simpan &amp; Buat PDF</button>
  `);
  document.getElementById('sk_jenis').onchange = e => { document.getElementById('sk_jenisCustomWrap').style.display = e.target.value==='__custom__' ? 'block' : 'none'; };
  if(prefill && !jenisOpts.includes(prefill.jenisSurat)) document.getElementById('sk_jenisCustomWrap').style.display='block';
  document.getElementById('sk_saveBtn').onclick = async () => {
    const jenisSel = document.getElementById('sk_jenis').value;
    const jenisSurat = jenisSel==='__custom__' ? document.getElementById('sk_jenisCustom').value.trim() : jenisSel;
    const kepada = document.getElementById('sk_kepada').value.trim();
    const perihal = document.getElementById('sk_perihal').value.trim();
    const isi = document.getElementById('sk_isi').value.trim();
    const tanggal = document.getElementById('sk_tanggal').value;
    if(!jenisSurat || !kepada || !perihal || !isi || !tanggal){ alert('Lengkapi semua field.'); return; }
    const nomorSurat = await pdfGetNomorSurat('SRT');
    const s = { id:uid(), nomorSurat, tanggal, jenisSurat, kepada, perihal, isi, status:'Terbit', permintaanId: (prefill&&prefill.permintaanId)||null };
    DB.suratKeluar.push(s);
    await save('suratKeluar');
    if(s.permintaanId){ const p = DB.suratPermintaan.find(x=>x.id===s.permintaanId); if(p){ p.status='selesai'; await save('suratPermintaan'); } }
    closeModal();
    downloadSuratKeluarPdf(s);
    if(onDone) onDone();
  };
}

async function downloadSuratKeluarPdf(s){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = pdfAddKopSurat(doc);
  const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const bln = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const tgl = new Date(s.tanggal+'T00:00:00');
  doc.setFontSize(10);
  doc.text('Nomor: '+s.nomorSurat, 14, y);
  doc.text('Tanggal: '+hari[tgl.getDay()]+', '+tgl.getDate()+' '+bln[tgl.getMonth()]+' '+tgl.getFullYear(), 14, y+6);
  y += 16;
  doc.setFont(undefined,'bold'); doc.text('Perihal: '+s.perihal, 14, y); doc.setFont(undefined,'normal');
  y += 6;
  doc.text('Kepada Yth.', 14, y);
  doc.setFont(undefined,'bold'); doc.text(s.kepada, 14, y+6); doc.setFont(undefined,'normal');
  y += 16;
  doc.setFontSize(10);
  const isiLines = doc.splitTextToSize(s.isi, 182);
  doc.text(isiLines, 14, y);
  y += isiLines.length * 5.5 + 14;
  pdfAddTandaTangan(doc, y);
  await save('settings');
  doc.save('Surat-'+s.jenisSurat.replace(/[^a-z0-9]/gi,'_')+'-'+s.tanggal+'.pdf');
}

async function downloadLaporanKeuanganDocx(bulan, trx, masuk, keluar){
  if(!DB.settings.templateLaporanKeuangan){ alert('Belum ada Template Laporan Keuangan diupload di Pengaturan.'); return; }
  const nomorSurat = await pdfGetNomorSurat('KEU-DOCX');
  await save('settings');
  const data = {
    ...dataDasarTemplate(),
    periode: bulanNama(bulan), nomor_surat: nomorSurat, tanggal_terbit: new Date().toISOString().slice(0,10),
    total_pemasukan: fmtRp(masuk), total_pengeluaran: fmtRp(keluar), saldo_periode: fmtRp(masuk-keluar), saldo_total: fmtRp(computeSaldo().total),
    transaksi: trx.map(t=>({ tanggal:t.tanggal, kategori:t.kategori, keterangan:t.keterangan||'-', jenis:t.jenis==='masuk'?'Pemasukan':'Pengeluaran', jumlah: fmtRp(t.jumlah) }))
  };
  tryGenerateDocx(DB.settings.templateLaporanKeuangan, data, 'Laporan-Keuangan-'+bulan+'.docx');

async function downloadStatusIuranDocx(bulan){
  if(!DB.settings.templateStatusIuran){ alert('Belum ada Template Status Iuran IPL diupload di Pengaturan.'); return; }
  const nomorSurat = await pdfGetNomorSurat('IPL-DOCX');
  await save('settings');
  const rows = sortWarga(DB.warga).map(w=>{
    const t = DB.tagihan.filter(x=>x.wargaId===w.id && x.bulan===bulan);
    const lunasCount = t.filter(x=>x.status==='lunas').length;
    const belumNominal = t.filter(x=>x.status==='belum').reduce((s,x)=>s+Number(x.nominal||0),0);
    const status = !t.length ? 'Belum Digenerate' : (lunasCount===t.length ? 'LUNAS' : 'BELUM LUNAS');
    return { blok_rumah: (w.blok||'-')+' / '+w.noRumah, kepala_keluarga: w.kepalaKeluarga, status, tunggakan: belumNominal?fmtRp(belumNominal):'-' };
  });
  const data = {
    ...dataDasarTemplate(),
    periode: bulanNama(bulan), nomor_surat: nomorSurat, tanggal_terbit: new Date().toISOString().slice(0,10),
    total_lunas: rows.filter(r=>r.status==='LUNAS').length, total_belum: rows.filter(r=>r.status==='BELUM LUNAS').length,
    rumah: rows
  };
  tryGenerateDocx(DB.settings.templateStatusIuran, data, 'Status-Iuran-IPL-'+bulan+'.docx');
}

function openMadModal(id){

  showModal(`${id?'Edit':'Tambah'} Postingan Mading`, `

    <div id="fotoPreview" class="pill-row" style="margin-bottom:10px"></div>
    <button class="btn" id="saveMadBtn" style="width:100%">Simpan</button>
  `);
  let fotos = m.fotoBase64 ? [...m.fotoBase64] : [];
  const drawPrev = () => { document.getElementById('fotoPreview').innerHTML = fotos.map((f,i)=>`<span class="badge lunas">Foto ${i+1}</span>`).join(' ') || '<span class="small-muted">Belum ada foto dipilih.</span>'; };
  drawPrev();
  document.getElementById('f_foto').onchange = async (e) => {
    const files = Array.from(e.target.files).slice(0,4);
    for(const f of files){
      const b64 = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
      fotos.push(b64);
    }
    drawPrev();
  };
  document.getElementById('saveMadBtn').onclick = async () => {
    m.tanggal = document.getElementById('f_mtgl').value;
    m.judul = document.getElementById('f_judul').value.trim();
    m.deskripsi = document.getElementById('f_desk2').value.trim();

    m.fotoBase64 = fotos;
    if(!m.judul){ alert('Judul wajib diisi'); return; }
    if(!id) DB.mading.push(m);
    try{ await save('mading'); }
    catch(e){ alert('Gagal menyimpan — kemungkinan ukuran foto terlalu besar. Coba foto yang lebih kecil.'); return; }
    closeModal(); renderAdmin(document.getElementById('app'));
  };
}

    removeCoverBg = false;
  };
  const removeCoverBtn = document.getElementById('removeCoverBgBtn');
  if(removeCoverBtn) removeCoverBtn.onclick = () => { pendingCoverBg = null; removeCoverBg = true; document.getElementById('coverBgPreview').innerHTML = '<span class="small-muted">Gambar akan dihapus setelah disimpan.</span>'; };
  const removeBtn = document.getElementById('removeLogoBtn');
  if(removeBtn) removeBtn.onclick = () => { pendingLogo = null; removeLogo = true; document.getElementById('logoPreviewWrap').innerHTML = '<span class="small-muted">Logo akan dihapus setelah disimpan.</span>'; };
  document.getElementById('s_stempel').onchange = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    pendingStempel = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
    removeStempel = false;
  };
  const removeStempelBtn = document.getElementById('removeStempelBtn');
  if(removeStempelBtn) removeStempelBtn.onclick = () => { pendingStempel = null; removeStempel = true; document.getElementById('stempelPreviewWrap').innerHTML = '<span class="small-muted">Stempel akan dihapus setelah disimpan.</span>'; };
  const bacaFileDocx = (inputId, statusId, setPending, setRemove) => {
    document.getElementById(inputId).onchange = async (e) => {
      const f = e.target.files[0]; if(!f) return;
      const base64 = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
      setPending(base64); setRemove(false);
      document.getElementById(statusId).innerHTML = `<span class="badge lunas">✔ ${esc(f.name)} siap diupload</span> <span class="small-muted">— klik Simpan Pengaturan untuk menerapkan</span>`;
    };
  };
  bacaFileDocx('s_tplSurat', 'tplSuratStatus', v=>pendingTplSurat=v, v=>removeTplSurat=v);
  bacaFileDocx('s_tplKeuangan', 'tplKeuanganStatus', v=>pendingTplKeuangan=v, v=>removeTplKeuangan=v);
  bacaFileDocx('s_tplIuran', 'tplIuranStatus', v=>pendingTplIuran=v, v=>removeTplIuran=v);
  const removeTplSuratBtn = document.getElementById('removeTplSuratBtn');
  if(removeTplSuratBtn) removeTplSuratBtn.onclick = () => { pendingTplSurat=null; removeTplSurat=true; document.getElementById('tplSuratStatus').innerHTML = '<span class="small-muted">Template akan dihapus setelah disimpan.</span>'; };
  const removeTplKeuanganBtn = document.getElementById('removeTplKeuanganBtn');
  if(removeTplKeuanganBtn) removeTplKeuanganBtn.onclick = () => { pendingTplKeuangan=null; removeTplKeuangan=true; document.getElementById('tplKeuanganStatus').innerHTML = '<span class="small-muted">Template akan dihapus setelah disimpan.</span>'; };
  const removeTplIuranBtn = document.getElementById('removeTplIuranBtn');
  if(removeTplIuranBtn) removeTplIuranBtn.onclick = () => { pendingTplIuran=null; removeTplIuran=true; document.getElementById('tplIuranStatus').innerHTML = '<span class="small-muted">Template akan dihapus setelah disimpan.</span>'; };
  const kopSuratInput = document.getElementById('s_kopSurat');
  if(kopSuratInput) kopSuratInput.onchange = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    pendingKopSurat = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
    removeKopSurat = false;
    document.getElementById('kopSuratPreviewWrap').innerHTML = `<img src="${pendingKopSurat}" style="width:100%;max-width:500px;border:1px solid var(--line);border-radius:8px"><br><span class="small-muted">Preview — klik Simpan Pengaturan untuk menerapkan.</span>`;
  };
  const removeKopSuratBtn = document.getElementById('removeKopSuratBtn');
  if(removeKopSuratBtn) removeKopSuratBtn.onclick = () => { pendingKopSurat = null; removeKopSurat = true; document.getElementById('kopSuratPreviewWrap').innerHTML = '<span class="small-muted">Kop surat custom akan dihapus setelah disimpan (kembali ke otomatis).</span>'; };
  document.getElementById('resetThemeBtn').onclick = () => {
    document.getElementById('s_forest').value = '#0E7C68';
    document.getElementById('s_ochre').value = '#B8873D';
    document.getElementById('s_bg').value = '#F7F5EF';
  };
  document.getElementById('saveSettingsBtn').onclick = async () => {
    const aiKey = document.getElementById('s_aiKey').value.trim();
    if(aiKey) localStorage.setItem('rtAiApiKey', aiKey); else localStorage.removeItem('rtAiApiKey');
    DB.settings.rtName = document.getElementById('s_name').value.trim() || 'RT';
    DB.settings.adminPass = document.getElementById('s_pass').value || 'admin123';
    DB.settings.footerText = document.getElementById('s_footer').value.trim();
    DB.settings.kontak = { telepon: document.getElementById('s_kTelp').value.trim(), email: document.getElementById('s_kEmail').value.trim(), alamat: document.getElementById('s_kAlamat').value.trim() };
    DB.settings.logo = removeLogo ? null : (pendingLogo || DB.settings.logo || null);
    DB.settings.stempel = removeStempel ? null : (pendingStempel || DB.settings.stempel || null);
    DB.settings.templateSurat = removeTplSurat ? null : (pendingTplSurat || DB.settings.templateSurat || null);
    DB.settings.templateLaporanKeuangan = removeTplKeuangan ? null : (pendingTplKeuangan || DB.settings.templateLaporanKeuangan || null);
    DB.settings.templateStatusIuran = removeTplIuran ? null : (pendingTplIuran || DB.settings.templateStatusIuran || null);
    DB.settings.kopSuratCustom = removeKopSurat ? null : (pendingKopSurat || DB.settings.kopSuratCustom || null);
    DB.settings.coverEnabled = document.getElementById('s_coverEnabled').checked;
    DB.settings.coverTitle = document.getElementById('s_coverTitle').value.trim();
    DB.settings.coverSubtitle = document.getElementById('s_coverSub').value.trim();
    DB.settings.coverButtonText = document.getElementById('s_coverBtn').value.trim();
    DB.settings.coverBg = removeCoverBg ? null : (pendingCoverBg || DB.settings.coverBg || null);
    DB.settings.pageBg = removePageBg ? null : (pendingPageBg || DB.settings.pageBg || null);
    DB.settings.tickerAutoEnabled = document.getElementById('s_tickerAuto').checked;
    DB.settings.tickerMessages = document.getElementById('s_ticker').value.split('\n').map(s=>s.trim()).filter(Boolean);
    DB.settings.theme = {
      forest: document.getElementById('s_forest').value,
      forestDark: document.getElementById('s_forest').value,
      ochre: document.getElementById('s_ochre').value,
      bg: document.getElementById('s_bg').value
    };
    try{ await save('settings'); }
    catch(e){ alert('Gagal menyimpan — kemungkinan ukuran gambar terlalu besar. Coba gambar yang lebih kecil.'); return; }
    document.getElementById('rt-title').textContent = DB.settings.rtName;
    document.getElementById('footerText').textContent = DB.settings.footerText;
    document.getElementById('footerBrand').textContent = DB.settings.rtName;
    applyBranding();
    renderCover();
    renderTicker();
    applyWallpaper();
    alert('Pengaturan disimpan.');
  };
}

/* ================= MODAL HELPERS ================= */
function showModal(title, bodyHtml){
  const bg = document.createElement('div'); bg.className='modal-bg'; bg.id='modalBg';
  bg.innerHTML = `<div class="modal"><div class="modal-head"><h3 style="margin:0">${title}</h3><button class="close-x" id="closeModalBtn">✕</button></div>${bodyHtml}</div>`;
  document.body.appendChild(bg);
  document.getElementById('closeModalBtn').onclick = closeModal;
  bg.addEventListener('click', e=>{ if(e.target===bg) closeModal(); });
}
function closeModal(){ const bg = document.getElementById('modalBg'); if(bg) bg.remove(); }

/* ================= INIT ================= */
document.getElementById('footerAdminLink').onclick = (e) => { e.preventDefault(); currentTab='admin'; render(); };

(async function init(){
  await loadAll();
  render();
})();
</script>
